<script>
const Q = [{"id":"1-1","set":1,"n":1,"q":"그 명칭을 불문하고 독도에 관한 명문규정이 있는 것은?","o":["항복문서, 포츠담 선언, 한일어업협정","한일기본관계조약, 카이로 선언, 평화선 선언","대일평화조약, 항복문서, 포츠담 선언","SCAPIN 제677호, SCAPIN 제1033호, 심흥택 보고서"],"a":3,"e":["-심흥택 보고서(p.51, p. 53): 일본 정부는 1905년 1월 28일 ‘무인도 소속에 관한 건’으로 각의에서 편입을 결정한 뒤, 2월 22일 시마네 현 고시 제40호로 이 사실을 고시했다. 일본은 독도를 편입했지만 이를 관보에 싣거나 관계국인 대한제국에 알리지 않았다. 이때문에 대한제국은 독도가 편입된 지 1년이 지나도록 이 사실을 모르고 있다가 1906년 3월 말에 울릉도를 방문한 시마네 현 관리들에 의해 알게 되었다. 45명으로 구성된 시찰단은 독도를 시찰하고 울릉도에 와서 울도 군수 심흥택에게 이 사실을 알렸고, 이에 놀란 심흥택은 3월 29일 강원도 춘천 군수 이명래에게 이 사실을 보고하였다. 보고서의 내용은 ‘일본 관원 일행이 본군에 와서, 본군 소재 독도를 일본의 속지라 자칭하고 지계의 활협과 호구의 결총을 일일이 기록해 갔다고 하였는데, 내부에서 지령하기를, 유람하는 길에 지계와 호구를 기록해 가는 것은 괴이할 게 없으나 독도라 칭하고 일본 속지라고 한 것은 결코 그럴 이치가 없는 것이니 이번 보고는 매우 놀랍다’라고 되어 있다. 이명래는 다시 참정대신 박제순에게 이 사실을 보고하였고, 박제순은 지령 제3호로 “독도가 일본 영토가 되었다는 사실은 전혀 근거가 없는 것이니 섬의 형편과 일본인의 행동을 잘 살펴 보고하라.”고 지령하였다.(1906.5.20.)","-카이로 선언(p.57) : 제 2차 세계 대전이 막바지에 접어들면서 미국, 영국, 중국의 수뇌는 1943년 11월 22일부터 26일까지 이집트 카이로에서 회담을 가졌다. 이 회담에서 전후 일본의 영토 처리에 관한 연합국의 기본 방침과 한국의 독립 문제가 언급되었다. 3개국 수뇌가 서명한 카이로 선언은 일본이 “폭력 및 탐욕으로 빼앗은 일체의 지역으로부터 물러나야 한다”라고 하였고, 또한 “한국민이 노예 상태임에 유의하여 한국을 자유롭고 독립된 국가로 할 결의를 다진다.”라고 했다.","-포츠담 선언(p.57) : 1945년 7월 26일의 포츠담 선언은 제8항에 “카이로 선언의 조항은 이행되어야 하며, 또한 일본의 주권은 혼슈, 훗카이도, 규슈 및 시코쿠와 연합국이 결정하는 작은 섬들에 국한될 것이다.”라고 하였다. 1945년 8월 15일 일본은 포츠담 선언을 수락하여 항복하였고, 9월 2일 항복 문서에 서명했다.","-SCAPIN 제677호, SCAPIN 제1033호(p.58): 제 2차 세계 대전에서 패전한 일본은 1945년 9월 2일 항복 문서에 조인한 시점부터 1952년 4월 28일 샌프란시스코 강화조약이 발효할 때까지 연합국의 점령 통치를 받았다. 1946년 1월 29일 연합국 최고사령관은 일본 정부에 각서 제677호 ‘일본으로부터 일정 주변 지역의 통치 및 행정상의 분리’, 이른바 스캐핀(SCAPIN) 제 677호를 내렸다. 이 각서를 통해 연합국은 일본 정부에 ‘일본 국외의 모든 지역’, 즉패전 직전까지 지배하고 있던 식민지나 점령지에 대한 정치•행정상의 권력 행사를 정지하도록 명령했다. 이 각서의 제3항은 일본의 영토를 “훗카이도, 혼슈, 규슈 및 시코쿠와 북위 30도 이상의 류큐 제도와 쓰시마를 포함한 약 1,000여개의 인접하는 여러 소도로 구성된다.”라고 정의했다. 여기서 ‘인접하는 여러 소도’에 포함되지 않는 지역으로 ‘울릉도와 독도, 제주도’가 명기되었다. 독도를 울릉도, 제주도와 마찬가지로 한국의 영토로 분류한 것이다.이어 연합국은 1946년 6월 22일 연합국 최고사령관 각서 제1033호(SCAPIN 1033) ‘일본의 어업 및 포경업 허가 구역’을 내어 일본의 선박 및 국민이 독도의 주변 12해리 이내에 접근하는 것을 금했다.","※ 스캐핀(SCAPIN)원래는 연합국 최고사령관 각서에 부여된 일련 번호인 ‘엽합국 최고사령관 각서 색인번호’의 약칭이지만 연합국 최고사령관 총사령부가 일본 정부에 대해 내린 포고, 명령 및 지령을 모두 포함한다.","-대일평화조약(샌프란시스코 강화 조약)(p. 60): 제2차 세계 대전의 패전국인 일본은 약 7년에 걸친 연합국의 점령 통치를 겪은 후에 연합국과 1951년 9월 8일 샌프란시스코 강화조약을 맺고 새로운 국제질서에 편입된다. 1946년 초부터 강화조약 초안이 만들어지기 시작하여 1951년 8월 최종 초안이 완성되기까지 20여차례 만들어졌다. 처음에 만들어진 초안과 달리 점차 미국과 소련이 이념적으로 대립하게 되고 중국이 공산화되면서 미국과 영국은 일본을 자본주의 진영으로 끌어들여 동아시아에서 공산주의의 방파제로 삼으려는 전략을 취하게 되었다. 이 과정에서 강화조약안은 일본에 대해 엄격하고 징벌적인 내용에서 관대하고 간결한 내용으로 변화되었다. 독도귀속 문제에 있어서 1947년 3월 19일자 강화조약 초안부터 1949년 11월 2일자까지는 독도가 한국 영토로서 명기되어 있었으나 12월 8일자 초안부터는 일본 영토로 명기되었고, 1950년 8월 7일자 초안부터는 독도가 조약안에서 빠졌다. 결국 1951년 8월 13일 완성된 샌프란시스코 강화조약 최종 초안은 제2조(a)항에 “일본은 한국의 독립을 승인하고,제주도, 거문도 및 울릉도를 포함한 한국에 대한 모든 권리, 권원, 그리고 청구권을 포기한다.”라고 규정하였다.일본은 샌프란시스코 강화조약으로 일본이 한국의 독립을 승인했으나 합병 이전의 일본 영토를 한국에 양도한다는 내용은 조약에 없으며, 제2조(a)항에 독도가 빠져 있다는 점을 들어 일본 영토라고 주장하고 있다.","-평화선 선언(p. 61) : 1952년 1월 18일 이승만 대통령은 ‘인접 해양에 대한 주권에 관한 선언(일명 평화선)’을 국무원 고시 제14호로 선포하였다. 일본은 독도가 평화선 내에 있음을 알고 항의해 왔으며, 평화선을 ‘이승만 라인’이라고 불렀다.","-한일기본관계조약(p. 62): 한국은 1948년부터 정부 수립 이후문화재 반환, 어업, 재일 한국인의 법적 지위, 샌프란시스코 강화조약에 따른 대일 청구권 문제 등을 해결하기 위해 일본과 교섭을 하게 되었다. 교섭을 하는 와중에서 일본정부는 이승만 대통령이 선포한 ‘평화선’에 대하여 항의를 하면서 회담마다 큰 장애가 되었다. 한일회담 중에 일본은 독도 문제를 국제사법재판소에 제소하는 것에 동의해 달라는 등 독도 문제를 제시하였으나 한국 정부는 독도가 국제사법재판의 대상이 될 수 없다고 단호히 거부했다. 여러 해의 교섭 끝에 1965년 6월 22일 한일기본조약을 조인하기는 했지만 조약문 안에 ‘독도’에 대한 직접적인 언급은 되지 않았다."]},{"id":"1-2","set":1,"n":2,"q":"다음 중 틀린 설명은?","o":["독도는 주도인 ‘동도’와 ‘서도’ 그리고 89개의 작은 바위섬으로 형성되어 있다.","서도가 동도보다 넓다.","서도가 동도보다 낮다.","우리나라의 동단은 동도의 동단인 경도 동경 131°52′22″이다."],"a":2,"e":["서도가 동도보다 넢다. 동도 높이는 99.6m, 서도 높이는 168.5m이다. (p. 8)"]},{"id":"1-3","set":1,"n":3,"q":"다음 설명 중 틀린 것은?","o":["동도에 독립문바위가 있고 서도에 3형제굴바위가 있다.","동도와 서도 간의 사이는 110~160m이다.","동도에 유인등대와 어민숙소가 있고 서도에 경찰경비대가 있다.","독도의 대포는 동도에 거치되어 있다."],"a":2,"e":["어민 숙소는 서도에 있다. 유인등대와 경찰경비대는 동도에 있다. (p. 8)"]},{"id":"1-4","set":1,"n":4,"q":"다음은 독도와 울릉도 간의 거리(A), 독도와 오끼섬 간의 거리(B)이다. 맞는 것은?","o":["A: 87.4km  ·  B: 157.5km","A: 157.5km  ·  B: 87.4km","A: 799.8km  ·  B: 37.14km","A: 805km  ·  B: 87.4km"],"a":0,"e":[]},{"id":"1-5","set":1,"n":5,"q":"다음 기술 중 틀린 것은?","o":["서도에 물골이 있다.","서도에 독도 이사부길이 있다.","서도는 동도의 서북방에 있다.","우리나라의 동단은 동도의 동단인 경도 동경 13°52′20″이다."],"a":1,"e":["서도에 “독도 안용복길”이 있고, 동도에 “독도 이사부길”이 있다. (p. 9)"]},{"id":"1-6","set":1,"n":6,"q":"다음 중 독도의 주소는?","o":["경상북도 울릉군 울릉읍 독도리 1~96번지","경상북도 울릉군 울릉읍 도동 42~76번지","강원도 울릉군 저동 42~70번지","경상북도 울릉군 도동읍 독도 1~42번지"],"a":0,"e":[]},{"id":"1-7","set":1,"n":7,"q":"“우산과 무릉 두 섬이 서로 거리가 멀지 아니하여 날씨가 맑으면 가히 바라볼 수 있다”라고 기술되어 있는 기록은?","o":["『고려사』","『삼국사기』","『세종실록지리지』","고종칙령 제41조"],"a":2,"e":["-삼국사기(p.24) : 독도에 대한 우리나라 최초의 기록이다. 신라의 이사부가 ‘우산국’을 복속시킨 내용이 기술되어 있다. 본래 삼국 시대 이전에 울릉ㄷ와 독도는 우산국으로 불렸다. 삼국시대에 우산국 사람들이 신라 내륙까지 들어와 노략질을 벌이자, 신라의 이찬 이사부가 우산국을 정벌하였고 해마다 토산물을 바치게 하였다. (지증왕 13년 512년)","-고려사(p. 25) : 『고려사』 「지리지」(1451년)에는 우산(독도)과 무릉(울릉도)이 다른 섬이라고 기록되어 있다. “어떤 이는 말하기를, 우산(독도)과 무릉(울릉도)은 본래 다른 섬으로 서로 거리가 멀지 않아 날씨가 맑으면 바라볼 수 있다고 하였다.","-세종실록지리지(p. 26) : 조선 초기에 정부는 나라의 체제를 정비하기 위해 전국적인 지리지 편찬작업에 착수하여 『세종실록』「지리지」(1454년)로 완성시켰다. 여기에 울릉도와 우산도에 관한 내용이 실려 있다. “우산과 무릉 두 섬은 울진현의 정동쪽 바다에 있다. 두 섬은 서로 거리가 멀지 않아 날씨가 맑으면 바라볼 수 있다. 신라 때에는 우산국이라 칭했는데, 울릉도라고도 한다. ”","-고종칙령 제 41호(p. 47~48): 고종은 울릉도 개척을 명했고, 1883년부터 주민들이 정식으로 이주하기 시작했다. 울릉도 개척민이 점차 늘어나고 울릉도에 들어오는 일본인도 늘어나자 이들을 관리해야 하는 문제가 발생했다. 정부는 울릉도에 도감을 두어 관리했으나 역부족이었고, 특히 일본이 1895년 청나라와의 전쟁에서 승리한 이후로는 더 많은 일본인이 들어와 많은 폐단이 생겨났다.   이에   대한제국   정부는   일본   정부에   요구하여      공동조사단을   구성하고,   울릉도의   현황을   조사했다.","(1900.5.31.~6.5). 대한제국 정부에서 파견된 우용정은 조사 후 일본인의 조속한 철수와 선박 구입, 그리고 울릉도의 관제 개편을 상부에 제안하였다. 그에 따라 대한제국은 칙령 제41호(1900.10.25.)를 내어 울릉도를 울도로 개칭하고 도감을 군수로 개정했다. 또한 울도 군수가 관할하는 지역으로 ‘울릉전도, 죽도, 석도’를 규정했다. 여기서 ‘죽도’는 울릉도 가까이 있는 대섬을 가리키고, ‘석도’는 독도를 말한다. 고종 황제의 명령이 칙령 제41호는 1900년 10월 27일자 「관보」(제 1716호)에 실려 울릉도와 독도의 영유권을 근대법적으로 분명히 했다."]},{"id":"1-8","set":1,"n":8,"q":"독도의 공식적인 영문표기는?","o":["Dockdo Islands","Dock Islands","Dokdo","Tok do"],"a":2,"e":["1951년 7월 19일 양유찬 주미 한국대사가 미 국무성에 보낸 공한에 “Dokdo”로 표기되어 있다."]},{"id":"1-9","set":1,"n":9,"q":"다음 중 연대순을 나열된 것은?","o":["포츠담 선언, 카이로 선언, 항복문서","항복문서, 카이로 선언, 포츠담 선언","카이로 선언, 포츠담 선언, 항복문서","항복문서, 포츠담 선언, 카이로 선언"],"a":2,"e":["카이로 선언은 1943년 12월 1일, 포츠담 선언은 1945년 7월 26일, 항복문서는 1945년 9월 2일, 대일평화조약은 1951년 9월 8일에 각각 있었다."]},{"id":"1-10","set":1,"n":10,"q":"팔도총도(八道總圖)는 어디에 있는 지도인가?","o":["『신증동국여지승람』","『삼국사기』","『고려사』","고종칙령 제41호"],"a":0,"e":["(p. 37) : 팔도총도는 『신증동국여지승람』에 수록된 고지도이다. ‘독도’를 ‘우산도’로 표기하여 한국의 영토임을 표시하고 있다.","-팔도총도 : 조선 시대 초기 지도에서 우산도(독도)가 가장 먼저 보이는 것은 『신증동국여지승람』(1531년)에 첨부된 ‘팔도총도’이다. 이 지도는 본래 1481년에 만들어진 것으로서 동해상에 울릉도와 우산도 두 개의 섬만 그려져 있는데,우산도가 울릉도보다 작게 울릉도 서쪽에 그려져있다. 위치가 정확하지는 않지만 이 지도에 두 개의 섬이 그려져 있다는 것은 당시 두 섬의 존재를 분명히 인지하고 있었음을 말해 준다."]},{"id":"1-11","set":1,"n":11,"q":"다음 중 평화선은 어떤 것인가?","o":["맥아더 라인","이승만 라인","크라크 라인","북방한계선"],"a":1,"e":["-맥아더 라인(p. 61) : 제2차 세계 대전이 끝난 후 일본을 점령 통치하던 연합국 최고사령관 총 사령부가 1946년 6월각서 제 1033호(SCAPIN 제1033호)로 ‘일본의 어업 및 포경업 허가구역’을 선포하여 일본 선박의 어로 활동 범위를 제한할 때 설정된 선이다. 당시 연합국 최고사령관 더글라스 맥아더의 이름을 따서 ‘맥아더 라인’이라고 부른다. 즉 ‘맥아더 라인’은 일본의 어업을 제한하는 효과가 있었다. 연합국 각서 제 1033호 제 3항은 “일본선박과 국민의 독도의 12해리 이내 접근을 금지하고 있다. 1952년 4월 28일 샌프란시스코 강화조약이 발효되면 맥아더 라인이 폐지되어 일본 어선이 몰려들 것으로 예상되었기 때문에 우리나라 어업을 보호하고자 평화선(이승만 라인)을 설정한 것이다.","-클라크 라인(크라크 라인) : 한국전쟁(6.25 전쟁) 휴전회담을 지연시키고 있던 공산군을 군사적으로 압박하기 위해 1952년 9월 27일 클라크 유엔군 사령관은 ‘한국방위수역(일명 ’클라크 라인‘)을 설정해 북한 해안을 봉쇄했다. 미국(미군‧유엔군)은, 중공(군)과 북한(인민군)에 대한 외부로부터의 압력을 강화해야할 필요가 더욱 커졌다. 외부(외국) 무기‧물자와 보급‧지원‧교역을 전면 차단함으로써 미국의 조건에 따르는 정전조건을 최단시일내에 수락하도록 압력을 가하는 수단으로서 중공과 북한에 대한 해안봉쇄(Embargo 또는 Blockade)를 실시하고 유엔총회에 그 승인을 요청하였다. 이처럼 전쟁 중에 해안봉쇄선으로 설정된 클라크 라인은 정전협정이 체결됨에 따라 1953년 8월 27일 유엔군 사령관에 의해 공식 해제되고 대외에 공표되었다."]},{"id":"1-12","set":1,"n":12,"q":"독도의 12마일 이내에 일본선박과 일본국민의 접근을 금지한 것은?","o":["평화선","SCAPIN 제677호","SCAPIN 제1033호","카이로 선언"],"a":2,"e":["1945년 9월 2일 연합군 최고사령부는 일본 정부에 대해 일본선박과 일본국민이 어로 활동을 할 수 있는 수역을 설정했다. 이 수역의 경계선은 ‘맥아더 라인’이라고 한다. 동 선언은 수차에 걸쳐 수정되게 되었다. 1948년 6월 22일의 ‘SCAPIN 제1033호’ 제3항은 일본선박과 국민의 독도의 12해리 이내 접근을 금지하고 있다."]},{"id":"1-13","set":1,"n":13,"q":"‘고종칙령 제41호’와 관계있는 것은?","o":["석도","제주도","평화선","항복문서"],"a":0,"e":["‘고종칙령 제41호’ 제2항은 ‘울릉도’를 ‘울도’로 개칭하고 군수를 파견했으며 울릉군수 관할구역의 하나로 석도를 규정하고 있다."]},{"id":"1-14","set":1,"n":14,"q":"대일평화조약에 관한 설명으로 옳은 것은?","o":["독도가 한국의 영토라고 명문으로 규정하고 있다.","독도가 일본의 영토라고 명문으로 규정하고 있다.","독도가 일본의 영토가 아니라고 명문으로 규정하고 있다.","독도가 일본의 영토라는 명문규정도 한국의 영토라는 명문규정도 들고 있지 않다."],"a":3,"e":["“대일평화조약(샌프란시스코 조약)”에는 독도에 대한 언급 자체가 없다."]},{"id":"1-15","set":1,"n":15,"q":"다음 중 울릉도와 독도를 조선과 동일한 황색으로 채색하고 독도 옆에 ‘조선의 것’이라고 표시한 지도는?","o":["삼국접양도","한국전도","조선동해인도","팔도총도"],"a":0,"e":["-삼국접양지도(1785년)(p.40) : 일본의 하야시 시헤이가 저술한 『삼국통람도설』 안에 있는 5장의 부속 지도 가운데 하나이다. 조선의 영토는 황색(노란색), 일본의 영토는 녹색으로 표현했다. 이 지도의 동해 부분에 ‘다케시마(竹島:울릉","도)’와 그 우측에 이름 없는 한 섬이 조선 본토와 같이 황색(노란색)으로 그려져 있고 두 섬 옆에 ‘조선의 것’이라고 명기되어 있다.","-한국전도(같은 이름으로 여러 일본인이 그린 한국전도가 있다.) -27번 문제와 연계됨.* 1905년 사이키 히로나오가 그린 지도로 박문관(博文館) 발행의『일로전쟁실기(日露戰爭實記)』제76편 부록에 수록된 것이다. 지도는 근대적 측량에 의한 것으로 정확하다. 독도는 동도와 서도로 자세하게 나타내고, 좌측 하단에는 경성시가도(京城市街圖)를 확대하여 나타내었다. 러일전쟁 이전까지 일본에서는 울릉도를 다케시마(竹島), 독도를 마쓰시마(松島)로 호칭하였다. 그러나 러일전쟁 직후 일본은 독도를 시마네현 소속으로 불법 편입하는 과정에서 독도 명칭을 다케시마(竹島)로 공식 표기하였다. 지도에 울릉도는 鬱陵島와 松島, 그리고 독도는 竹島와 리앙쿠르 암(リヤノコールト岩)으로 병기되어 있다.한국전도(韓國全圖)* 1904년 이토 마사죠(伊藤政三)가 그린 지도로 전국의 각 도와 부, 군, 읍 등의 행정지명, 그리고 산세, 철도 및 도로 등의 교통로가 상세하게 나타나 있다. 동해상의 두 섬 울릉도는 괄호 안에 松島, 독도는 竹島로 표기하였다. 독도는 경도는 정확하지만, 위도는 약간 북으로 치우쳐 있다. 지도에서 한국과 일본, 한국과 중국 사이의 바다에는 아무런 채색을 하지 않았다. 그러나 한국의 서해안, 남해안, 동해안 부근과 섬 주변은 모두 청색으로 채색하여 한국의 영해 개념이 나타나 있다. 울릉도와 독도도 한국 연안의 다른 섬과 동일하게 청색으로 채색하였다. 그러나 이 지도의 저자가 1910년 10월에 발간한 동일 지도(조선전도)에는 한국의 영해를 의미하는 채색이 사라지고, 모든 바다를 연한 청색으로 채색하였다.","-조선동해안도 : 1857년 러시아 해군이 작성한 지도를 1876년 일본해군성에서 작전용으로 재발행한 것이다. 한반도 동부해안의 포구와 해안선, 울릉도와 독도가 부속도서로 상세히 그려져 있고, 조선의 영토로 명확하게 나타나고 있다."]},{"id":"1-16","set":1,"n":16,"q":"다음 중 “울릉도와 독도는 일본과는 관계가 없음을 명심할 것”이라고 기술되어 있는 것은?","o":["은주시청합기","태정관 지령문","안용복 심문서","조선국교제시말내탐서"],"a":1,"e":["1877년 3월 20일 태정관은 내무성의 공문에 따라 “울릉도와 독도는 일본과 관계없음을 명심하라”는 지령을 하달했다.","-은주시청합기(p.39) : 1667년 작성된 오키 섬에 관한 지리지로 일본 문헌 중 독도에 관해 기술된 최초의 기록이다.이즈모(현재 시마네현 지역) 마츠에번(현재 시마네현청 소재지)의 관리인 사이토 호센이 번주의 지시에 따라 1667년 8월부터 약2개월 동안 은주(현 오키섬)에서 보고 들은 일을 기록한 조사보고서이다. 사이토 호센은 은주에서 각 방향과 거리에 따른 지역을 소개하면서 은주에서 서북방향으로 독도가 있고 일본의 서북한계는 은주라고 하였다. ‘은주는 북해 가운데 있는데 은기도라고 한다. 남쪽으로 운주의 미수관이 35리, 남동쪽으로 백기주의 적기포가 30리 떨어져 있다.남서쪽으로 석주의 온천진이 58리 떨어져 있고 북에서 동으로 연결되는 곳은 없다. 은주에서 서북쪽으로 이틀 낮과 하룻밤을 가면 송도(독도)가 있고, 또 하루를 가면 죽도(울릉도)가 있다. 그런 즉 일본의 서북쪽 한계는 이 주로 한다.’","-안용복 심문서(p. 30~33) : 안용복은 1693년과 1696년 두 차례에 걸쳐 일본에 건너가 울릉도와 독도가 조선 땅임을 주장한 인물이다. 1693년 (숙종 19년) 3월, 안용복은 울릉도에서 어로 작업을 하다가 일본 어부들에게 납치되어 오키 섬으로 잡혀갔다. 안용복은 울릉도와 독도가 조선의 땅임을 주장하고, 자신들을 납치한 부당한 행위에 항의하였다. 하지만 일본정부는 안용복을 구금하고 조사한 뒤 조선으로 돌려보내도록 지시하는 한편, 막부는 ‘조선인 출어 금지를 요청하는 서계(외교문서)’를 조선 정부에 보내도록 명했다. 이때부터 두 나라 사이에 울릉도와 독도를 두고 서로 자국의 땅이라고 주장하며 영유권을 다투는 일이 계속되었다(1694~1695년). 그간 에도 막부는 울릉도와 독도가 돗토리 번에 속하는지를 질문하였다.결국 울릉도와 독도를 둘러싸고 2년이 넘는 조사와 논쟁 끝에 일본 에도 막부는 울릉도와 독도가 조선 땅임을 인정하였다. 그리고 일본 어민들로 하여금 울릉도에 가지 못하도록 하는 ‘죽도(竹島: 울릉도) 도해금지령’을 내렸다.허가없이 월경한 죄로 2년간 옥살이를 하고 나온 안용복은 억울함을 호소하고 일본인의 울릉도 도해를 금지시킬 목적으로 다시 일본에 건너갔다. 1696년 울릉도 근해에서 일본 어민들을 만나자 그들에게 함부로 울릉도에 온 사실을 따졌고 일본 어민들이 달아나자 오키 섬까지 그들을 쫓아가 울릉도와 자산도(독도)가 조선의 섬임을 주장하며 호키 태수(돗토리 번주)에게 보고해 줄 것을 요청했다. 안용복이 항의하러 온 사실은 바로 돗토리 번을 통해 막부에 보고되었고 결국 안용복 일행은 추방되어 강원도 양양으로 돌아왔다.(1696. 8). 일본은 그동안 안용복을 거짓말쟁이라고 비판해 왔다. 그런데 안용복이 일본에서 취조받은 내용이 적힌 문서인 「원록 9 병자년 조선주착안 일권지각서」가 2005년 5월 오키 섬에서 발견되었다. 안용복은 두 번째로 일본에 갈 때 「조선팔도지도」를 준비해 갔는데, 일본 관리가 지도를 옮겨 적은 문서에 ‘다케시마(竹島: 울릉도)’와 ‘마쓰시마(松島: 독도)’ 가 조선의 강원도 소속으로 되어 있다.","-조선국교제시말내탐서 : 1868년 일본이 ‘메이지 유신’을 단행하여 봉건국가에서 근대 국가로 전환을 추진하고, 쇄국체제에서 개국 체제로 전환하려 하면서 조선과 새로 국교를 맺고자 1869년 12월 외무성 관리를 파견하여 조선의 사정을 염탐했다. 이때 조사하도록 지시한 내용을 모두 14개 항목이었는데, 조사 후 제출된 보고서가 「조선국 교제시말 내탐서」(1870년)이다. 여기에는 ‘다케시마(竹島: 울릉도)’와 마쓰시마(松島: 독도)가 조선의 부속이 된 경위‘라는 제목으로 울릉도와 독도에 관한 내용이 기록되어 있다. ‘마쓰시마(독도)는 다케시마(울릉도) 옆에 있는 섬으로 마쓰시마 건에 관해서는 이제까지 남아 있는 기록이 없습니다.다케시마 건에 관해서는 원록(元祿:안용복 사건 당시 일본 연호) 연간 이후 잠시 조선에서 거류를 위해 사람을       견한적이 있으나 당시에는 이전처럼 사람이 없었습니다. 대나무 또는 대나무보다 큰 갈대가 자라며, 인삼 등이 자연적으로 자랍니다. 그 밖에 물고기고 상당히 있다고 들었습니다. ’","-태정관 지령문(p.45~46): 근대화를 진행하던 일본의 내무성은 1876년 일본 전역의 지적을 편찬하는 작업을 진행하면서 시마네현에 ‘다케시마(竹島: 울릉도)에 대한 기록과 지도 등을 제출하도록 요청했다. 이에 시마네 현은 「기죽도약도」를 첨부하고 아울러 지적도에     다케시마(竹島: 울릉도) 외 일도(一島)’를 일본 영토로 등재해도 좋을지에 대해서도 문의했다. 내무성은 이 지도에 근거하여 두 섬은 일본령이 아니라고 결론지었으나 영토에 관한 중대한 결정이므로 태정관이 최종 결정을 내려 줄 것을 요청했다. 이에 태정관은 시마네 현이 올린 문서와 지도를 조사한 끝에 1877년 3월 29일 “다케시마와 그 밖의 일도에 관한 건은 본방(일본)과 관계없음을 알 것”이라는 이른바 ‘태정관 지령’을 내렸다. 이 지령은 일본 정부가 독도를 일본 땅이 아니라고 공식 문서이다."]},{"id":"1-17","set":1,"n":17,"q":"“본 주의 서북쪽 끝은 오끼섬을 경계로 한다”라고 기술하고 있는 것은?","o":["은주시청합기","태정관 지령문","안용복 심문서","조선국교제시말내탐서"],"a":0,"e":["1667년의 일본 외무성 관리가 울릉도, 독도를 시찰하고 작성 보고한 『은주시청합기』에는 “본 주의 서북쪽 끝은 오끼섬을 경계로 한다”라고 기술하였다."]},{"id":"1-18","set":1,"n":18,"q":"‘SCAPIN 제677호’에 의해 일본의 통치권으로부터 배제된 것은?","o":["제주도","울릉도","독도","제주도, 울릉도, 독도"],"a":3,"e":["1948년 1월 29일 SCAPIN 제677호 3항은 제주도, 울릉도 그리고 독도는 일본의 정의(통치권)에서 제외된다고 규정하고 있다."]},{"id":"1-19","set":1,"n":19,"q":"다음 기술 중 틀린 것은?","o":["일본 측의 독도에 관한 최초기록인 『은주시청합기』는 울릉도와 독도는 일본의 국경 밖에 있음을 확인했다.","1778년의 태정관 지령은 내무성의 공문에 대해 “울릉도와 독도는 일본과 관계없음을 명심하라”고 지시했다.","1876년 일본외무성관리의 『조선국교제시말내탐서』“송도에 관해서는 지금까지 게재된 서류가 없음”이라고 기재되어 있다.","일본의 독도에 관한 최초기록인 『은주시청합기』는 우리의 독도에 관한 최초기록보다 500년 이상 앞선 것이다."],"a":3,"e":["『은주시청합기』는 1667년의 기록으로 우리의 독도에 관한 최초기록인 1145년 『삼국사기』보다 500여 년 뒤진 것이다."]},{"id":"1-20","set":1,"n":20,"q":"다음 기술 중 틀린 것은?","o":["신라 이사부 장군이 지증왕 13년(512년)에 우산국을 정복, 독도는 신라의 통치하에 있게 되었다.","숙종 때 안용복은 2차에 걸쳐 일본에 가서 일본 관헌으로부터 울릉도와 독도는 한국의 영토라는 확인을 받았다.","검찰사로 임명된 이규원의 울릉도 현황의 보고에 따라 고종은 쇄환정책을 수립하게 되었다.","울릉군수 심흥택은 일본의 독도침탈 의도를 조정에 보고하면서 보고서에 ‘독도’라는 명칭을 사용했다."],"a":2,"e":["이규원의 보고에 따라 고종은 쇄환정책을 수립한 것이 아니라 폐지했다. (39번 문제와 연결됨)조선정부는 17세기 후반부터 19세기 후반까지 정기적으로 수토관을 보내 울릉도와 주변 섬을 점검하였다. 수토관은 섬에 살고 있는 주민들을 데리고 나왔으나 사람들의 왕래가 끊이지 않았고 일본인들도 나무를 몰래 베어 가거나 전복을 재취하고 있었다. 1880년대 초, 일본인이 울릉도에 ‘마쓰시마(松島)’라고 적은 푯말을 세워 놓은 사실을 알게 된 조선 정부는 울릉도 개척 여부를 조사했다. 1882년 4월 고종은 이규원에게 울릉도 검찰사의 관직을 주어 울릉도와 주변 섬을 조사하도록 명했다. 당시 울릉도에는 조선인이 141명 일본인이 78명 정도 있었다. 이규원은 100명이 넘는 수행원과 함께 조사한 뒤 보고서 형태인 「울릉도 검찰일기 계초본」과 울릉도 지도인 「울릉도 외도」 및 「울릉도 내도」를 고종에게 올렸다. 이규원의 보고를 받은 고종은 울릉도 개척을 명했고, 1883년부터는 주민들이 정식으로 이주하기 시작했다. 정부는 개척민에게 세금을 면제해 주고 배 만드는 일을 허락하는 등 우대 정책을 실시하여 이주를 장려하는 한편, 김옥균을 ‘동남제도 개척사’로 임명하여 울릉도와 주변의 여러 섬을 개척하는 일을 맡겼다. 당시 울릉도에 두 번에 걸쳐 들어간 개처단은 모두 16가구, 54ㅁ명이었다. 이들은 생활에 필요한 물자와 식량, 소 두 마리, 무기 등을 가지고 들어갔다. 이러한 조치는 조선 정부가 울릉도를 비롯한 주변 도서에 대하여 본격적인 관리를 하기 시작했음을 의미한다. *이규원 : 조선 말기의 무신으로 울릉도 검찰사로서 울릉도를 순찰한 후 『울릉도 검찰일기』 등을 남겼다."]},{"id":"1-21","set":1,"n":21,"q":"다음 ( )를 완성하시오.\n독도가 형성된 것은 ( A )년 전이고, 독도수면 ( B)m 밑에 거대 화산체가 숨겨져 있다.","o":["A: 460만  ·  B: 2,200","A: 200만  ·  B: 1,000","A: 250만  ·  B: 1,500","A: 300만  ·  B: 2,200"],"a":0,"e":["독도는 460만년 전에 바닷속 화산폭발로 형성되었다. 독도 수면 아래 2,200m에 거대한 화산체가 숨겨져 있다.(p.13~15)"]},{"id":"1-22","set":1,"n":22,"q":"다음 ( )를 완성하시오.\n우리나라의 동단은 ( A )인 경도 동경 ( B )이다.","o":["A: 동도와 서도의 중앙  ·  B: 131°52′20″","A: 동도의 중앙  ·  B: 131°52′20″","A: 서도의 저단  ·  B: 131°52′20″","A: 동도의 동단  ·  B: 131°52′22″"],"a":3,"e":[]},{"id":"1-23","set":1,"n":23,"q":"다음 설명 중 옳은 것은?","o":["유인등대는 동도에 있고 경찰경비대는 서도에 있다.","유인등대는 동도에 있고 경찰경비대도 동도에 있다.","유인등대는 서도에 있고 경찰경비대는 동도에 있다.","유인등대는 서도에 있고 경찰경비대도 서도에 있다."],"a":1,"e":["어민숙소(주민숙소)는 서도에 있다."]},{"id":"1-24","set":1,"n":24,"q":"다음 설명 중 옳은 것은?","o":["독도와 울릉도 간의 거리는 87.4km이고 독도와 오끼섬 간의 거리는 157.5km이다.","독도와 울릉도 간의 거리는 87.4km이고 독도와 오끼섬 간의 거리는 120.5km이다.","독도와 울릉도 간의 거리는 157.5km이고 독도와 오끼섬 간의 거리는 87.4km이다.","독도와 울릉도 간의 거리는 87.4km이고 독도와 오끼섬 간의 거리는 120km이다."],"a":0,"e":["독도와 울릉도 간의 거리는 87.4km이고, 독도와 오끼섬 간의 거리는 157.5km이다.     (p. 8)"]},{"id":"1-25","set":1,"n":25,"q":"다음 ( )를 완성하시오.\n독도의 행정구역은 ( A )번지이고, 우편번호는 ( B ) 이다.","o":["A: 경상북도 울릉군 울릉읍 독도리 1~96  ·  B: 700-805","A: 경상북도 울릉군 울릉읍 독도리 1~96  ·  B: 799-805","A: 경상북도 울릉군 울릉읍 도동 1~47  ·  B: 799-805","A: 경상북도 울릉군 울릉읍 저동 1~47  ·  B: 799-805"],"a":1,"e":[]},{"id":"1-26","set":1,"n":26,"q":"다음 중 연대순으로 나열된 것은?","o":["카이로 선언, 대일평화조약, SCAPIN 제677호","카이로 선언, 포츠담 선언, 대일평화조약","포츠담 선언, 카이로 선언, 항복문서","카이로 선언, 항복문서, 포츠담 선언"],"a":1,"e":["카이로 선언은 1943년 12월 1일, 포츠담 선언은 1945년 7월 26일, 항복문서는 1945년 9월 2일, SCAPIN 제677호는 1948년 1월 29일, 대일평화조약은 1951년 9월 8일에 각각 있었다."]},{"id":"1-27","set":1,"n":27,"q":"<한국전도>는 어디에 수록된 지도인가?","o":["SCAPIN 제677호","대일평화조약","일로전쟁실기","동국여지승람"],"a":2,"e":["『일로전쟁실기』에 수록된 “한국전도”는 독도를 한국의 영토로 표시하고 있다.*『일로전쟁실기』 : 도쿄 최대의 출판사 가운데 하나인 박문관이 1905년 6월 20일 출판한 방대한 러일전쟁 승전기록집으로 제 76편의 부록에 1905년 6월 당시의 “한국전도”를 부록으로 붙였다. “한국전도”는 일본 각의에서 독도를 일본 영토로 편입하기로 결정한 이후임에도 불구하고 오른쪽 끝선 밖에 있는 것을 무리하게 포함시켜 가면서까지 독도를 한국 영토로 표시하였다. 즉 일본 정부의 각료와 관계자들을 제외하고는 일본인들 자신도 한국 영토인 독도를 일제가 침탈한 사실을 알지 못했다는 것을 알 수 있다. 이는 일본 내에서도 시마네 현 고시 제40호를 알지 못했음을 나타내는 것이다."]},{"id":"1-28","set":1,"n":28,"q":"1876년, 일본해군성에서 독도를 한국의 영토로 표시한 군사작전용으로 발행한 지도는?","o":["조선동해안도","일본전도","조선국지리도","팔도총도"],"a":0,"e":["“조선동해안도”는 1857년 러시아 해군이 조선동해안에 대한 러시아 군함의 탐사결과를 바탕으로 작성하여 발행한 지도를 1876년 일본해군성에서 작전용으로 재발행한 것이다. 한반도 동부해안의 포구와 해안선, 울릉도와 독도가 부속도서로 상세히 그려져 있고, 조선의 영토로 명확하게 나타나고 있다.","-대일본전도 : 일본 육군참모국이 1877년에 제작한 ‘대일본전도’ 에는 오키나와 등 일본 주변 섬들을 포함한 일본 영토를 자세하게 나타냈지만 독도는 빠져 있다. 이는 17세기부터 독도를 자국 영토의 일부로 인식했다는 일본의 주장이 허구임을 보여준다.","-조선국지리도 : 『조선국지리도』(朝鮮國地理圖)는 1592년 도요토미 히데요시가 조선 침략을 준비하며 수군 장수였던 구키 요시다카에게 지시하여 그린 지도이다. 구키는 『신증동국여지승람』(新增東國輿地勝覽, 1530년)에 수록된 「팔도총도」(八道總圖)를 그대로 본떠 채색하여 그렸다. 현존하는 『조선국지리도』는 1872년에 다시 그린 것이다. 울릉도와 독도의 위치와 명칭을 그대로 사용하였고, 「팔도총도」와 「강원도」(江原道) 별도에 울릉도와 독도 두 섬을 포함함으로써 두 섬이 조선의 영역임을 명백히 밝혔다. 현재 발견된 일본지도 가운데 울릉도와 독도를 우리식으로 표기한 최초의 지도이다."]},{"id":"1-29","set":1,"n":29,"q":"독도를 ‘조선의 것’이라고 지도에 표시한 일본지도는?","o":["삼국접양도","조선국지리도","팔도총도","조선동해안도"],"a":0,"e":[]},{"id":"1-30","set":1,"n":30,"q":"1952년 1월 18일 국무원고시 제14호로 선언한 것과 무관한 것은?","o":["평화선","이승만 라인","인접해양에 관한 주권선언","항해의 자유 부정"],"a":3,"e":["1952년 1월 18일 국무원고시 제14호로 선언한 “인접해양에 관한 주권선언”에 의해 설정된 경계선을 “평화선”,“이승만 라인”이라 한다. 이는 인접해양 내의 항해의 자유를 인정하고 있다.(제4항)"]},{"id":"1-31","set":1,"n":31,"q":"‘SCAPIN 제1033호’와 관계있는 것은?","o":["독도의 12해리 이내에 일본선박과 일본국민의 접근금지","평화선","죽도도해금지령","SCAPIN 제677호"],"a":0,"e":[]},{"id":"1-32","set":1,"n":32,"q":"석도와 가장 관계있는 것은?","o":["심흥택 보고서","우용정 보고서","SCAPIN 제677호","대한제국칙령 제41호"],"a":3,"e":["‘대한제국칙령 제41호’ 제3항은 울릉군의 관할구역의 하나로 ‘석도’를 규정하고 있다.","-우용정 보고서(울도기) : 1900년(고종 37) 우용정이 울릉도 시찰위원으로 임명된 후, 주한 일본공사 하야시와 부산해관 세무사 라포트 등과 함께 울릉도를 조사하여 울릉도의 물산, 일본인의 실태, 해운, 행정 실태, 조세 문제, 일본인 납세 문제, 등장(진정서) 등을 기록한 종합 보고서이다. 즉 이는 1882년 울릉도 개척 이후 보고된 공식 종합 보고서라고 할 수 있다. 우용정은 1900년 5월 31일에 울릉도에 도착하여 조사 후 6월 15일에 돌아와 보고서를 제출하고, 일본인의 조속한 철수와 울릉도 관제의 개편을 건의하였다. 그 결과 같은 해 10월 27일 칙령 제41호(10월 25일 제정)를 반포하여 울릉도를 울도로 개칭하고, 도감을 군수로 바꿈으로써, 강원도의 27번째 군으로 지방 관제에 편입시켰다. 그러나 ‘울도기’는 우용정이 울릉도를 시찰하고 난 후 개인적으로 작성한 기행문의 성격이 강하다."]},{"id":"1-33","set":1,"n":33,"q":"삼봉도는 어느 때 불려진 독도의 이름인가?","o":["고종","성종","정조","태조"],"a":1,"e":["-독도명칭의 변화(p. 49)","· 우산도(于山島) : 『태종실록』(1417년)에 최초로 이 명칭이 보인다. 자산도(子山島), 천산도(千山島), 방산도(方山島), 간산도(干山島) 등으로도 표기하는데 이는 ‘于(우)’자를 비슷한 다른 한자로 잘못 베껴서 빚어진 현상이다.","· 삼봉도(三峰島) : 조선 성종 때 삼봉도라는 섬이 따로 있다는 보고가 올라온 적이 있다. 조사해 보니, 이 섬은 울릉도를 가리키거나 독도를 가리키는 경우가 있었다. 세 개의 봉우리가 보인다고 해서 삼봉도라 불렸으나 울릉도 역시 봉우리가 세 개로 보이기도 한다.","· 가지도(可之島, 可支島) : 조선 정조 때 독도에 가지어(嘉支漁: 강치)라는 물고기가 발견되었다고 해서 가지도라고도 불렀다. ‘가지’의 한자가 다른 것은 우리말 가제를 한자로 표기하는 과정에서 달라진 것으로 보인다.","· 석도(石島, 돌섬, 독섬) : 1900년 대한제국 칙령 제41호에 보이는 호칭으로 석도를 우리말로 풀어 쓰면 ‘돌섬’이다. ‘돌’을 사투리로 ‘독’이라고 하므로 ‘독섬’이라고도 불렸다. 다시 이를 한자로 적는 과정에서 독섬이 ‘독도’가 되었다.","· 독도(獨島) : 일본 기록에는 1904년에 나오지만 우리나라 문헌에는 1906년 심흥택의 보고서에서 처음 보인다. 현재 독도의 로마자 표기는 ‘Dokdo’이다."]},{"id":"1-34","set":1,"n":34,"q":"‘석도’와 가장 관계있는 것은?","o":["고종칙령 제 41호","심흥택 보고서","가지도","동국여지승람"],"a":0,"e":["1900년 10월 25일 고종칙령 제41호 제2조에 울릉군수는 울릉전도와 죽도, 석도를 관할한다고 규정하고 있다."]},{"id":"1-35","set":1,"n":35,"q":"안용복과 가장 관계있는 것은?","o":["심흥택 보고서","자산도","고종칙령 제41호","삼국사기"],"a":1,"e":["1693년(숙종 19년)과 1696년(숙종 22년)에 안용복은 일본에 건너가 일본 관헌으로부터 울릉도와 송도(자산도)는 한국의 영토라고 확약을 받았다."]},{"id":"1-36","set":1,"n":36,"q":"다음 연결 중 틀린 것은?","o":["삼봉도-성종","가지도-정조","석도- 태조","자산도-숙종(안용복)"],"a":2,"e":["태조 때는 독도가 ‘우산도’라고 불렸다."]},{"id":"1-37","set":1,"n":37,"q":"리앙끄르암과 관계있는 것은?","o":["영국유람선","네덜란드 상선","프랑스 포경선","러시아 구축함"],"a":2,"e":["(p. 54) : 서양에서는 독도가 ‘리앙쿠르 락스’로 알려져 있다. 1849년 1월 27일 프랑스의 포경선 리앙쿠르호가 독도를 처음 발견한 뒤 배 이름을 붙여 보고하였기 때문이다. 이에 1851년 프랑스 해군이 제작한 「태평양전도」(1851년) 에 독도가 ‘리앙쿠르 암(Rochers Liancourt)’으로 기재된 것을 계기로 국제 사회에 알려졌다."]},{"id":"1-38","set":1,"n":38,"q":"다음 중 연대순으로 나열된 것은?","o":["우산도, 가지도, 삼봉도, 석도, 독도","우산도, 석도, 삼봉도, 가지도, 독도","삼봉도, 우산도, 가지도, 독도, 석도","우산도, 삼봉도, 가지도, 석도, 독도"],"a":3,"e":[]},{"id":"1-39","set":1,"n":39,"q":"다음은 독도에 공이 있는 인물에 대한 설명이다. 틀린 것은?","o":["이사부-우산국 정복","안용복-2차 도일 일본관헌으로부터 울릉도와 독도가 한국의 영토라는 확인","이규헌-울릉도 현황보고로 쇄환정책 수립","심흥택-일본의 독도침탈의도 조정에 보고"],"a":2,"e":["검찰사 이규원의 보고로 고종은 쇄환정책을 폐기하게 된다."]},{"id":"1-40","set":1,"n":40,"q":"다음 설명 중 틀린 것은?","o":["‘삼국접양도’는 울릉도와 독도를 조선과 동일한 황색으로 채색하고 있다.","‘조선동해안도’는 러시아 지도를 일본해군성이 재작성한 것으로 울릉도와 독도를 한국의 영토로 표기하고 있다.","『일로전쟁실기』에 수록된 ‘한국전도’는 독도를 한국의 영토로 표시하고 있다.","‘팔도총도’는 ‘조선국지리도’에 수록된 지도로 울릉도와 독도(우산도)를 조선의 영토로 표시하고 있다."],"a":3,"e":["‘팔도총도’는 ‘신증동국여지승람’에 수록된 지도로 울릉도와 독도(우산도)를 조선의 영토로 표시하고 있다."]},{"id":"1-41","set":1,"n":41,"q":"독도가 형성된 시기는?","o":["460만 년 전","250만 년 전","120만 년 전","100만 년 전"],"a":0,"e":["독도는 460만 년 전에, 울릉도는 250만 년 전에, 그리고 제주도는 120만 년 전에 각각 화산폭발로 형성되었다."]},{"id":"1-42","set":1,"n":42,"q":"일본 선박 및 국민의 독도의 12해리 내에 접근을 금지한 것은?","o":["SCAPIN 제677호","SCAPIN 제1033호","대일평화조약","항복문서"],"a":1,"e":["1946년 6월 22일의 SCAPIN 제1033호는 일본선박 및 일본국민의 독도의 12해리 접근을 금지했다.(제3항)"]},{"id":"1-43","set":1,"n":43,"q":"“일본은 폭력과 탐욕에 의해 취득한 영토로부터 축출되어야 한다”라고 규정한 것은?","o":["카이로 선언","포츠담 선언","항복문서","SCAPIN 제677호"],"a":0,"e":["카이로 선언에 일본은 폭력과 탐욕에 의해 취득한 영토로부터 축출되어야 한다고 규정하고 있다. 독도는 일본이 폭력과 탐욕에 의해 취득한 영토이므로 일본을 독도로부터 축출되어야 한다."]},{"id":"1-44","set":1,"n":44,"q":"다음 연결 중 틀린 것은?","o":["우산도-태종","삼봉도-성종","가지도-정종","석도-숙종"],"a":3,"e":["석도는 ‘고종칙령 제41호“에 의해 사용된 독도의 이름이다. 숙종 때는 자산도로 불렸다."]},{"id":"1-45","set":1,"n":45,"q":"대일평화조약에 관한 설명 중 틀린 것은?","o":["48개 연합국과 일본 간에 체결되었다.","한국은 체약 당사국이 아니다.","독도는 한국의 영토라는 명문규정이 있다.","일본이 한국의 독립을 승인한다는 명문규정이 있다."],"a":2,"e":["“대일평화조약(샌프란시스코 조약)”에는 독도가 한국의 영토라는 명문규정도 일본의 영토라는 명문규정도 없다.제2조 (a)항에 일본은 한국의 독립을 승인한다는 명문규정이 있다."]},{"id":"1-46","set":1,"n":46,"q":"“울릉과 우산은 모두 우산국의 땅이다.”라고 기록되어 있는 것은?","o":["동국문헌비고, 삼국사기","중보문헌비고, 고려사","고려사, 삼국사기, 만기요람","만기요람, 중보문헌비고, 동국문헌비고"],"a":3,"e":["p.36에 사료 표를 참고하세요","-만기요람, 중보문헌비고 , 동국문헌비고 : 『여지지』에 이르기를, ‘울릉과 우산은 모두 우산국 땅인데, 우산은 바ㅗ 왜인들이 말하는 송도이다.’"]},{"id":"1-47","set":1,"n":47,"q":"『강계고』에 기록되어 있는 것은?","o":["우산과 무릉은 하나의 섬이다.","우산과 무릉은 우산국이다.","우산과 무릉은 우산국이 아니다.","우산은 우산국이 아니다."],"a":1,"e":["p.36에 사료 표를 참고하세요","-강계고(신경준) : 여러 도지(圖志)를 상고하면 두 섬이다. 하나는 왜가 말하는 송도라고 했으니 대체로 두 섬은 모두 우산국이다."]},{"id":"1-48","set":1,"n":48,"q":"날씨가 맑으면 울릉도에서 독도(우산도)를 바라볼 수 있다고 기록되어 있는 것 중 가장 옳은 것은?","o":["삼국사기","고려사","만기요람","세종실록지리지, 신증동국여지승람"],"a":3,"e":["문제가 잘못되었습니다. ‘고려사 지리지’, 와 ‘세종실록 지리지’가 답임.","-삼국사기 : 지증왕 13년 여름 6월에 우산국이 항복하고 매년 토산물을 공물로 바쳤다. 우산국은 명주의 정동쪽 바다에 있는 섬으로 울릉도라고도 한다.","-고려사 지리지 : 우산과 무릉은 본래 다른 섬으로 서로의 거리가 멀지 않아 날씨가 맑으면 바라볼 수 있다고 하였다.","-세종실록지리지 : 두 섬은 서로의 거리가 멀지 않아 날씨가 맑으면 바라볼 수 있다. 신라 때에는 우산국이라 칭했다.","-신증동국여지승람 : 두 섬은 현의 정동쪽 바다에 있다. (중략) 날씨가 맑으면 봉우리 위의 수목과 산 밑의 모래톱을 또렷이 볼 수 있으며(후략)"]},{"id":"1-49","set":1,"n":49,"q":"독도가 가질 수 있는 것은?","o":["영해","접속수역","영해, 접속수역","영해, 접속수역, 배타적 경제수역, 대륙붕"],"a":3,"e":[", 50번 : 독도는 “유엔해양법협약” 제 21조 제 3항에 규정된 암석이 아니므로, 섬으로서 영해, 접속수역, 배타적 경제수역, 대륙붕을 갖는다.","-유엔해양법협약 제 121조(p. 21 뒷장에 ‘심화학습’을 보세요): 유엔해양법협약은 해양에 관한 종합적인 법 제도로서 1982년 12월 채택된 뒤 1994년 11월에 발효되었다. 이 협약은 12해리 영해, 200해리 배타적 경제 수역 제도를 두어 연안국의 권리를 강화했으며, 해양 분쟁의 제도적이고 평화적인 해결을 위하여 국제해양법재판소를 설립하였다. 유엔해양법협약의 ‘섬’에 관한 규정에 따르면 독도는 국제법상 섬에 해당된다. 유엔해양법협약 제121조 1. 섬이라 함은 바닷물로 둘러싸여 있으며, 밀물일 때에도 수면 위에 있는, 자연적으로 형성된 육지를 말한다.2. 제3항에 규정된 경우를 제외하고는 섬의 영해, 접속 수역, 배탸적 경제수역 및 대륙붕은 다른 영토에 적용 가능한 이 협약의 규정에 따라 결정한다.3. 인간이 거주할 수 없거나 독자적인 경제 활동을 유지할 수 없는 암석은 배타적 경제 수역이나 대륙붕을 갖지 않는다."]},{"id":"1-50","set":1,"n":50,"q":"“유엔해양법협약” 제 121조 제3항에서 규정하고 있는 것은?","o":["인간이 거주할 수 없거나 독자적인 경제활동을 할 수 없는 암석은 배타적 경제수역을 갖지 아니한다.","인간이 거주할 수 없거나 독자적인 문화활동을 할 수 없는 암석은 배타적 경제수역이나 대륙붕을 가지지 아니한다.","인간이 거주할 수 없거나 독자적인 경제활동을 할 수 없는 암석은 배타적 경제수역이나 대륙붕을 가지지 않는다.","인간이 거주할 수 없거나 협동적인 경제활동을 할 수 없는 암석은 배타적 경제수역이나 대륙붕을 가지지 않는다."],"a":2,"e":[]},{"id":"1-51","set":1,"n":51,"q":"다음 설명 중 틀린 것은?","o":["국제수로기구(IHO)는 『바다와 해양의 경계』라는 책자를 발간한다.","1929년의 『바다와 해양의 경계』에는 동해를 일본해로 표기하고 있다.","1937년의 『바다와 해양이 경계』 수정판에는 동해를 일본해로 표기하고 있다.","1953년의 『바다와 해양의 경계』 수정판에는 동해를 일본해/동해로 표기하고 있다."],"a":3,"e":["(p.21) : 1953년판 ‘바다와 해양의 경계’에서 동해를 일본해로 표기하고 있다. 대한민국 정부는 1991년 유엔에 가입한 후 1992년 유엔지명표준회 회의에서 동해를 동해/일본해로 표기할 것을 주장하고 있다.","-국제수로기구(IHO) : 1919년에 창설된 국제수로국이 1970년 국제수로기구로 개편된 것으로, 각국 수로 기관 간의 협조와 수로지도의 통일 기하기 위해 설립되었다. 회의는 5년마다 모나코에서 열리며, 한국은 1957년 가입하였다.","-해양과 바다의 경계 : IHO 간행물 '해양과 바다의 경계'는 바다의 명칭과 구역을 정하여 선박의 항해안전과 수로학 및 해양학적인 활용을 목적으로 국제수로기구에서 1929년 처음으로 발간한 책자이다.1919년 런던에서 개최된 제1차 국제수로기구회의에서 안전한 항해를 위하여 세계의 해양과 바다의 한계를 설정하고이에 고유한 이름을 붙이도록 한 결의안에서부터 시작한다. 이 회의 당시에 우리나라는 일본의 식민 지배하에 있었기 때문에 국제수로회의에 참석하여 우리의 의사를 표시할 수 없는 가운데 일본대표만이 참가하였으며 결의안에 따라 일본은 동해명칭을 1923년 일본해로 등록하여 회원국가에 의견을 물은 바 아무도 이에 이의를 제기하지 않음으로써 1929년 모나코회의에서 그간 수집된 자료를 ‘해양과 바다의 경계(Limits of Oceans and Seas)’ 라는 Special Publication No. 23으로 출간하였다. 이후 전세계의 지도제작자는이를 표준으로 삼아 해양과 바다의 명칭을 사용하게 된 것이다. 그 이후 ‘일본해’ 표기는 1953년 간행된 제3판에까지 그대로 표기되었으며 당시 우리나라는 IHO에 미가입한 상태였다.그 이후 제11차 IHO총회(1977년)에서 오래된 제3판을 개정하여 새로운 '해양과 바다의 경계'를 발간하기로 의결하였으며, 이에 따라 사무국에서는 해역별 지도를 삽입한 제4판 개정안을 마련하여 1986년 회원국의 투표에 회부하였으나 부결된 바 있다.개정판 발간이 늦어지자 제15차 총회(1997년)에서 개정판 작업을 외부용역에 의해 급속히 추진하기로 의결하고, 전임IHO이사(1992~1997)였던 Adam Kerr에게 개정판 편집 업무를 맡기게 되었으며, 회원국에게 회람된 제4판 개정안의초안도 Adam Kerr에 의하여 약 4년 동안 편집된 결과이다. 제4판 개정안을 편집하는 지난 몇 년 동안 사무국에서는 동해표기와 관련하여 당사국들과 많은 의견을 교환한 바 있으며, 우리측에서는IHO기술결의(A.4.2.6)에 따라 “동해/일본해” 병기를 지속적으로 주장하여 왔다.2002년 IHO 총회 이후 지속적으로 동해 표기를 위한 노력을 기울이고 있으며 2009년 \"해양과 바다의 경계(Limits of Oceans and Seas)\" 간행 실무반이 구성되어 외교통상부, 동북아역사재단 등 관계기관과 협조 및 활발한 활동을 하고 있다."]},{"id":"1-52","set":1,"n":52,"q":"다음 설명 중 틀린 것은?","o":["독도는 12해리 영해를 갖는다.","독도는 200해리 배타적 경제수역을 갖는다.","독도의 200해리 배타적 경제수역은 일본의 200해리배타적 경제수역과 중첩된다.","한국의 배타적 경제수역과 일본의 배타적 경제수역의 중첩은 울릉도와 오끼섬의 중간선으로 한일 간에 합의를 보았다."],"a":3,"e":["(p. 19) : 1996년 한국과 일본이 각각 200해리 EEZ를 선포한 결과, 양국의 EEZ에 중첩되는 해역이 발생하였다. 이에 대한 양국의 해양 경계가 필요했으나 경계에 대한 양측의 주장이 대립하여 잠정적으로 어업에 관한 사항만을 규율하는 어업 협정이 체결되었다. 이 어업 협정은 한․일 양국의 배타적 경제 수역에 적용된다. 아래 그림을 보면 우리나라와 일본측이 주장하는 EEZ의 경계선이 다른다. 현재까지 한일 간의 배타적 경제수역의 중첩문제는 아직 해결을 보기 못하고 잠정적으로 “한일어업협정”으로 동해의 중간수역과 남해의 중간수역을 설정하고 있다."]},{"id":"1-53","set":1,"n":53,"q":"평화선에 관한 다음 기술 중 틀린 것은?","o":["1952년 1월 18일 선포","국무원고시 제14호","인접해양에 관한 주권선언","대일평화조약 체결 후 맥아더 라인 철폐 후 선언"],"a":3,"e":["“대일평화조약(샌프란시스코 조약)”이 1951년 9월 8일에 체결되어 맥아더 라인이 폐지될 것에 대비하여 맥아더라인 철폐 전에 선언한 것이다."]},{"id":"1-54","set":1,"n":54,"q":"다음 평화선에 대한 기술 중 틀린 것은?","o":["평화선은 한국 측에서 보아 독도의 내측에 설정되었다.","평화선을 선언한 대통령 선언의 정식명칭은 “인접해양에 관한 대통령의 주권선언”이다.","확정된 국제선례에 따른 것이다.","국무원고시 제14호로 선언"],"a":0,"e":["인접해양의 경계선인 평화선은 한국 측에서 보아 독도의 외측에 설정되었다. 그러므로 일본 정부가 평화선 선언에 항의해 옴으로써 한일 간에 독도 영유권문제가 발단되게 되었다."]},{"id":"1-55","set":1,"n":55,"q":"독도에 관한 실효적 지배 법률이 아닌 것은?","o":["「문화재보호법」","「독도 등 도서지역의 상태보전에 관한 법률」","「독도의 지속 가능한 이용에 관한 법률」","「독도개발에 관한 법률」"],"a":3,"e":["(p. 11) : 독도개발에 관한 법률은 제정된 바가 없다.","-독도의 관리이용에 관한 법률 : 독도는 전체가 국유지임(관리청 : 해양수산부)∙ 「문화재보호법」 제 25조에 의한 ‘독도 천연 보호 구역’(천연기념물 제336호)으로 지정되어 공개 제한 지역이었으나 일반인의 출입이 가능하도록 공개 제한이 해제(2005. 3. 24)되어, 신고로 입도 가능.","※ 1982년 11월 ‘천연기념물 제336호 독도 해조류 번식지’로 지정된 것을 1999년 12월 ‘천연기념물 제336호 독도 천연 보호 구역’으로 명칭 변경.∙기타 「독도 등 도서 지역의 생태계 보전에 관한 특별법」(1997. 12), 「독도의 지속 가능한 이용에 관한 법률」(2005.","5) 등에 의거, 국가 지정 문화재 및 천연기념물로서 엄격히 보존․관리되고 있음."]},{"id":"1-56","set":1,"n":56,"q":"독도를 특정도서로 지정한 법률은?","o":["「독도 등 도서지역의 생태보전에 관한 법률」","「독도의 지속 가능한 이용에 관한 법률」","「문화재보호법」","「도서보호법」"],"a":0,"e":["독도를 특정도서로 지정한 것은 「독도 등 도서지역의 생태보전에 관한 법률」에 의거한 것이다.","-「독도 등 도서지역의 생태보전에 관한 법률」∙제 1조(목적) 이 법은 특정도서의 다양한 자연생태계, 지형 또는 지질 등을 비롯한 자연환경의 보전에 관한 기본적인 사항을 정함으로써 현재와 미래의 국민 모두가 깨끗한 자연환경 속에서 건강하고 쾌적한 생활을 할 수 있도록 함을 목적으로 한다. ∙제2조(정의) 잉 법에서 사용하는 용어의 뜻은 다음과 같다.1. “특정도서”란 사람이 거주하지 아니하거나 극히 제한된 지역에만 거주하는 섬(이하 “무인도서” 등이라 한다.)으로서 자연생태계•지형•지질 자연환경(이하 “자연생태계 등”이라 한다) 이 우수한 독도 등 환경부장관이 지정하여 고시하는 도서를 말한다.","-「독도의 지속가능한 이용에 관한 법률」∙제1조(목적) : 이 법은 독도와 독도 주변 해역의 이용과 보전•관리 및 생태계보호 등을 위하여 필요한 사항을 정함으로써 독도와 독도 주변 해역의 지속가능한 이용에 이바지함을 목적으로 한다.∙제2조(국가 등의 기본책무)","①국가는 독도의 보전․관리를 위하여 필요한 정책을 개발하고 시행하여야 한다.","②국가 및 지방자치단체는 독도의 지속가능한 이용을 위한 정책을 추진할 때에는 독도와 독도 주변 해역의 생태계보호와 해양수산자원의 합리적인 관리․이용이 조화와 균형을 이루도록 하여야 한다."]},{"id":"1-57","set":1,"n":57,"q":"다음 중 독도를 천연기념물로 지정한 법률은?","o":["「문화재보호법」","「천연기념물 보호법」","「독도의 지속 가능한 이용에 관한 법류」","「환경법」"],"a":0,"e":["「문화재보호법」제 25조의 규정에 의거하여 천연기념물로 지정되었다."]},{"id":"1-58","set":1,"n":58,"q":"다음 설명 중 틀린 것은?","o":["독도는 「문화재보호법」에 의거, 1982년 11월 4일에천연기념물로 지정되었다.","천연기념물 지정번호는 제 366이다.","1999년 12월 1일 지정종별이 ‘독도천연구역’으로 변경되었다.","현재 천연기념물 독도의 지정종별은 천연기념물이다."],"a":2,"e":["1999년 12월 1일에 지정명칭을 독도천연구역으로 개정한 것이다. 1982년 11월 4일에 천연기념물(지정종별) 제 336호(지정번호), 해조류번식지(지정명칭)로 지정되었다. 1999년 12월 1일 지정명칭만을 ‘독도천연구역’으로 변경했다."]},{"id":"1-59","set":1,"n":59,"q":"일본은 “폭력과 탐욕에 의해 약취한 영토로부터 축출된다.”라고 규정한 것은?","o":["항복문서","카이로 선언","포츠담 선언","대일평화조약"],"a":1,"e":[]},{"id":"1-60","set":1,"n":60,"q":"다음 연결 중 틀린 것은?","o":["은주시청합기-일본의 서북쪽 경계는 이주(오끼시마)를 경계로 한다.","태정관 지령문-죽도 외 1도의 건에 대해서는 일본과 관계없음을 명심할 것","조선국교제시말내탐서-송도의 건에 관해서는 지금까지 게재된 서류가 없다.","일본여지로정전도-일본영토는 청색으로 울릉도와 독도는 적색으로 착색했다."],"a":3,"e":["(p. 39) : 일본여지로정전도는 울릉도와 독도는 착색하지 않았다.","-일본여지로정전도 : 일본의 나가쿠보 세키스이가 제작한 지도로 일본의 영토는 채색을 했지만 ‘다케시마(竹島:울릉도),’마쓰시마(松島:독도)‘ 두 섬이 조선 본토와 함께 채색되지 않은 상태로 그려져 있어 일본 영역 밖의 섬으로 나타나 있다."]},{"id":"1-61","set":1,"n":61,"q":"다음 중 형성순서대로 나열된 것은?","o":["제주도, 울릉도, 자산도","독도, 울릉도, 제주도","독도, 제주도, 울릉도","제주도, 독도, 울릉도"],"a":1,"e":["독도, 울릉도, 제주도 순으로 형성되었다. 독도는 460만년 전, 울릉도는 250만년 전, 그리고 제주도는 120만년전에 화산폭발로 각각 형성되었다. 자산도는 독도의 옛 이름이다."]},{"id":"1-62","set":1,"n":62,"q":"‘SCAPIN 제677호’에 의해 일본이 통치권으로부터 분리된 도서는?","o":["제주도","제주도, 울릉도","제주도, 울릉도, 거문도","제주도, 울릉도, 독도"],"a":3,"e":["1946년 1월 29일 연합국최고사령관의 지령인 ‘SCAPIN 제 677호’는 그 제3항에서 제주도, 울릉도, 독도를 일본의 정의에서 배제하는 규정을 두고 있다."]},{"id":"1-63","set":1,"n":63,"q":"다음 중 연대순으로 나열된 것은?","o":["우산도, 가지도, 석도, 독도","우산도, 삼봉도, 가지도, 독도, 석도","삼봉도, 우산도, 가지도, 석도, 독도","우산도, 삼봉도, 가지도, 석도, 독도"],"a":3,"e":["우산도는 태종시대, 삼봉도는 성종시대, 가지도는 정조시대, 석도와 독도는 고종시대의 독도의 명칭이다."]},{"id":"1-64","set":1,"n":64,"q":"다음 설명 중 틀린 것은?","o":["리앙끄르암-프랑스 포경선","고종칙령 제41호-석도","SCAPIN 제677호-독도 제외","평화선-독도 내측에 설정"],"a":3,"e":["평화선은 독도 외측에 설정되었다."]},{"id":"1-65","set":1,"n":65,"q":"“대일평화조약”에 관한 기술 중 가장 옳은 것은?","o":["독도는 한국의 영토라고 명문규정을 두고 있다.","독도는 일본의 영토라고 명문규정을 두고 있다.","독도는 한국의 영토가 아니라고 명문규정을 두고 있다.","독도는 한국의 영토라는 명문규정도 일본의 영토라는 명문규정도 없다."],"a":3,"e":["“대일평화조약(샌프란시스코 조약)”에 독도가 한국의 영토라는 명문규정도 일본의 영토라는 명문규정도 없다."]},{"id":"1-66","set":1,"n":66,"q":"“우산과 무릉 두 섬은 우산국이다.”라고 기록되어 있는 것은?","o":["세종실록지리지","고려사","삼국사기","강계고"],"a":3,"e":["(p.29) : 신경준이 지은 『강계고』에 “우산과 무능 두 섬은 우산국이다”라고 기록되어 있다.","-『강계고』 : 조선 후기의 학자 신경준이 지은 책(1756년)이다.‘내가 살펴보니, 『여지지』에, ’일설에 우산과 울릉은 본래 한 섬이라고 하나 여러 도지(지도)를 상고하면 두 섬이다.하나는 왜가 말하는 송도(松島:마쓰시마, 독도)‘라고 했으니 대체로 두 섬은 모두 우산국이다.’라고 위 기록을 보면 우산도가 일본이 말하는 송도(마쓰시마)라고 하여 우산도가 독도임을 분명히 하고 있다. 또한 두 섬 모두 우산국에 속한다고 한 것은 우산국이 조선 영토이므로 두 섬 모두 조선 영토임을 말한 것이다."]},{"id":"1-67","set":1,"n":67,"q":"“우산과 무릉은 우산국이다.”라고 기록되어 있는 것은?","o":["삼국사기","고려사","신증동국여지승람","만기요람"],"a":3,"e":["(7, 48번 문제 참고) : 『만기요람』에는 “우산과 무릉은 우산국이다”라고 기록되어 있다.","- 『만기요람』(p. 36) :‘여지지에 이르기를, ’울릉과 우산은 모두 우산국 땅인데, 우산은 바로 왜인들이 말하는 송도이다.‘"]},{"id":"1-68","set":1,"n":68,"q":"우산과 무릉 두 섬은 서로의 거리가 멀지 아니하여 날씨가 맑으면 바라볼 수 있다고 기록되어 있는 것은?","o":["삼국사기","고려사","세종실록지리지","팔도지리지"],"a":2,"e":[]},{"id":"1-69","set":1,"n":69,"q":"“유엔해양법협약”상 인간이 거주할 수 없거나 독자적인 경제활동을 할 수 없는 암석이 가질 수 없는 것은?","o":["영해, 접속수역","영해, 배타적 경제수역","영해, 배타적 경제수역, 대륙붕","배타적 경제수역이나 대륙붕"],"a":3,"e":["(49, 50번 문제 참고) : “유엔해양법협약”상 인간이 거주할 수 없거나 독자적 경제활동을 할 수 없는 암석은 배타적 경제수역이나 대륙붕을 갖지 않는다고 규정하고 있다. 따라서 암석은 영해와 접속수역을 갖는다.","-접속수역 : 접속수역은 배타적으로 주권을 행사할 수 있는 ‘영해’는 아니지만 범죄 등의 예방을 위해 선박들에 대한 검사 등 제반조치를 할 수 있는 권한이 미치는 지역. 국가가 영해범위 밖의 일정한 수역에서 관세, 재정, 위생, 출입국관리에 관한 국내법을 적용할 수 있는 한정적 관할권을 행사하는 구역을 말한다.(유엔해양법협약 제33조) 접속수역의 범위는 영해가 3해리였을 때는 영해의 기준선에서 12해리까지 였으나, 영해가 12해리까지 확대됨에 따라 24해리까지로 되었다. (유엔해양법협약 제3조)"]},{"id":"1-70","set":1,"n":70,"q":"다음 중 틀린 설명은?","o":["『해양과 바다의 경계』는 국제연합경제사회이사회에서 발간하는 책자이다.","1929년에 발간된 『해양과 바다의 경계』에 동해를 일본해로 표기하고 있다.","1937년의 『해양과 바다의 경계』수정판에도 동해를 일본해로 표기하고 있다.","1953년의 『해양과 바다의 경계』수정판에도 동해를 일본해로 표기하고 있다."],"a":0,"e":["『해양과 바다의 경계』는 국제수로기구(IHO)가 발간한 책자이다. 한국은 1957년 IHO에 가입했다."]},{"id":"1-71","set":1,"n":71,"q":"다음 중 틀린 설명은?","o":["지명표준화회의(UNCSGN)는 통계위원회에서 5년마다 개최되는 국제회의이다.","회의에서 지명의 표준화를 다룬다.","우리나라는 1991년 유엔에 가입한 후 1999년에 동 위원회에 가입했다.","동 회의에서 한국은 동해를 동해(East Sea)로 표기할 것을 주장하고 있다."],"a":3,"e":["(p. 20) : 한국은 유엔지명표준화회의에서 동해를 동해/일본해로 병기할 것을 주장하고 있다. 표준화회의는 지명분쟁이 발생할 경우 해결이 이루어질 때까지 지명을 병기하는 것을 권고하고 있다.","-동해 지명: 동해는 우리 민족이 2,000년 이상 사용해 온 지명이다. 이러한 사실은 『삼국사기』 고구려본기 동명성왕 조(기원전 37년)와 광개토대왕릉비의 비문(414년), 『신증 동국여지승람』(1531년)에 수록된 「팔도총도」, 『여지도』(18세기 말)에 수록된 「아국총도」 등 다수의 고문헌과 고지도에서 확인할 수 있다. 19세기 말까지 일본은 지도에 동해 해역을 조선해,일본해 등으로 표기했고, 서양에서는 중국해, 만주해, 동양해, 동해, 한국해, 일본해, 타타르해 등 다양하게 표기하였다.그러나 19세기 후반과 20세기에 걸친 일본의 제국주의와 식민주의로 국제 사회에서는 ‘동해’ 대신 ‘일본해’ 지명이 일반적으로 통용되고 있다. 대한민국 정부는 1991년 유엔 가입 후 1992년 유엔지명표준화회의(UNCSGN)에서 동해 해역의 지명을 일본해로 단독 표기하는 것은 부당하다고 주장하였다. 국제 사회는 두 국가 사이에 지명 분쟁이 발생할 경우, 해결이 이루어지기 이전까지는 지명을 병기하도록 권고하고 있다. 이에 한국은 East Sea/Sea of Japan으로 병기할 것을 주장하고 있으나, 일본은 동해 해역의 지명으로 일본해 단독 표기 이외에 어떠한 지명도 수용이 불하다는 입장을 취하고 있다.","-유엔지명표준화회의 : 유엔 산하의 유엔통계위원회에서 5년마다 개최하는 국제회의로, 지명의 표준화를 다룬다. 우리나라는 1979년에 가입하였다."]},{"id":"1-72","set":1,"n":72,"q":"『바다와 해양의 경계』를 간행하는 곳은?","o":["유엔지명표준화회의","유엔해양법협약 당사국회의","국제수로기구","한일어업공동위원회"],"a":2,"e":["『바다와 해양의 경계』는 국제수로기구가 발간하는 책자이다. 1929년판, 1937년 수정판, 1953년 수정판이 동해를 일본해로 표기하고 있다. 1919년에 창설된 ‘국제수록국’이 1970년의 국제수로기구로 개편되었다. 동 기구는 각국 수로기관 간의 협조와 수로표시의 통일을 기하기 위해 설립된 것으로 5년마다 모나코에서 회의를 갖는다. 한국은 동 기구에 1957년에 가입했다."]},{"id":"1-73","set":1,"n":73,"q":"다음 중 틀린 설명은?","o":["1996년 8월 8일 한국의 「배타적 경제수역법」의 제정․공포로 독도는 200해리 배타적 경제수역을 갖는다.","1996년 6월 20일 일본은 「배타적 경게수역 및 대륙붕에 관한 법률」을 제정․공포하여 200해리 배타적 경제수역을 설정했다.","따라서 한국의 배타적 경제수역과 일본의 배타적 경제수역은 중첩되게 되었다.","이 배타적 경제수역의 중첩은 독도와 오끼섬의 중간선으로 한일 간에 합의를 보았다."],"a":3,"e":["한일 간에 배타적 경제수역의 경계획정문제는 아직 합의를 보지 못하고 있다."]},{"id":"1-74","set":1,"n":74,"q":"동해 중간수역에 관한 다음 기술 중 틀린 것은?","o":["한일 간에 배타적 경제수역의 중첩문제를 합의 해결할 때까지 잠정적으로 한일 간에 설정된 수역이다.","독도의 주위에 설정된 잠정수역이다.","“한일어업협정”으로 설정된 수역이다.","“한일기본관계조약”으로 설정된 수역이다."],"a":3,"e":["중간수역은 “한일어업협정”으로 설정된 잠정수역이다. (제9조)","75, 76번 : 인접해양의 경계선인 ‘평화선’은 한국 측에서 보아 독도의 외측에 설정되었다. “대일평화조약”이 1951년 9월 8일에 체결되어 그것이 효력을 발생하게 되면 맥아더 라인이 철폐되게 될 것에 대비ㅏ여 선언되었다. ‘평화선’이 독도의 외측에 설치되어 일본이 항의를 제기하여 독도의 영유권 문제가 한일 간에 발단되게 되었다."]},{"id":"1-75","set":1,"n":75,"q":"평화선에 관한 다음 기술 중 틀린 것은?","o":["1952년 1월 18일 선포","한국 측에서 보아 독도의 내측에 설정","동 선언은 일본, 영국, 미국으로부터 항의를 받았다.","맥아더 라인 철폐 전에 설정"],"a":1,"e":[]},{"id":"1-76","set":1,"n":76,"q":"한일 간에 독도의 영유권 문제가 발단되게 된 것은?","o":["맥아더 라인 설정","평화선 설정","한일기본관계조약 체결","배타적 경제수역 설정"],"a":1,"e":[]},{"id":"1-77","set":1,"n":77,"q":"독도는 ‘천연기념물’로 지정되었다. 「문화재보호법」상 천연기념물은 다음 중 어디에 해당하는가?","o":["지정번호","지정명칭","지정종별","지정구분"],"a":2,"e":["천연기념물은 지정종별이다. 지정명칭은 독도천연보호구역이고, 지정번호는 제336호이다."]},{"id":"1-78","set":1,"n":78,"q":"다음 ( )를 완성하시오.\n울릉도와 독도 간의 거리는 ( A )이고, 독도와 오끼섬 간의 거리는 ( B )이다.","o":["A: 87.4km  ·  B: 157.5km","A: 87.4km  ·  B: 88.5km","A: 89.0km  ·  B: 157.5km","A: 87.4km  ·  B: 799km"],"a":0,"e":["울릉도와 독도 간의 거리는 87.4km이고 오끼섬과 독도 간의 거리는 157.5km로 울릉도와 독도 간의 거리가 오끼섬과 독도 간의 거리보다 70여 km 짧다."]},{"id":"1-79","set":1,"n":79,"q":"다음 중 옳은 설명은?","o":["유인등대는 동도에, 경찰경비대는 서도에 있다.","유인등대는 서도에, 경찰경비대는 동도에 있다.","유인등대는 서도에, 경찰경비대는 서도에 있다.","유인등대는 동도에, 경찰경비대는 동도에 있다."],"a":3,"e":["유인등대와 경찰경비대는 모두 동도에 있다. 어민수고(주민숙소)는 서도에 있다."]},{"id":"1-80","set":1,"n":80,"q":"다음 연결 중 틀린 것은?","o":["태정관 지령문-죽도 외 1도는 일본과 관계없음을 명심할 것","은주시청합기-일본의 서북쪽 경계는 이주(오끼시마)를 경계로 한다.","조선국교제시말내탐서-송도의 건에 관해서는 지금까지 게재된 서류가 없다.","삼국접양도-일본영토는 적색으로, 조선영토는 청색으로 착색하고 울릉도와 독도는 청색으로 착색했다."],"a":3,"e":["‘삼국접양지도’에서 조선영토는 황색으로 칠했는데, 울릉도와 독도또 조선영토의 색과 같은 황색으로 칠했고,일본영토는 녹색으로 칠했다."]},{"id":"1-81","set":1,"n":81,"q":"그 자체로 일본에 대해 법적 구속력이 있는 것은?","o":["카이로 선언","포츠담 선언","항복문서","카이로 선언, 포츠담 선언"],"a":2,"e":["“카이로 선언”과 “포츠담 선언” 자체는 연합국의 일방적인 정책의 선언이므로 이들은 일본에 대해 법적 구속력이 없다. “항복문서”에는 일본이 서명했으므로 이는 일본에 대해 법적 구속력이 있다. 하지만 “항복문서”는 “포츠담 선언”의 내용을 이행한다는 규정이 있으므로 “항복문서”에 의해 “포츠담 선언”은 일본에 대해 법적 구속력이 있으며,“포츠담 선언”은 “카이로 선언”의 제 조항을 이행한다고 규정하고 있으므로 “카이로 선언”은 일본에 대해 법적 구속력을 갖는다. 이와 같이 “항복문서”를 통해 “포츠담 선언”이 일본에 대해 법적 구속력을 갖게 되었고 따라서 “카이로 선언”도 일본에 대해 법적 구속력을 갖게 되었다."]},{"id":"1-82","set":1,"n":82,"q":"다음 설명 중 틀린 것은?","o":["리앙끄르암-프랑스 포경선","고종칙령 제41조-석도","SCAPIN 제677호-독도 제외","평화선-독도 내측에 설정된 인접해양의 경계선"],"a":3,"e":["평화선은 독도 외측에 설정되었다."]},{"id":"1-83","set":1,"n":83,"q":"독도의 12해리 이내의 접근을 금지한 것은?","o":["SCAPIN 제1033호","SCAPIN 제677호","이승만 라인","인접해양주권선언"],"a":0,"e":["1948년 6월 22일의 ‘SCAPIN 제1033호’는 일본선박과 국민의 독도 12해리 이내 접근을 금지했다.(제3항)"]},{"id":"1-84","set":1,"n":84,"q":"다음 연결 중 직접 관계가 없는 것은?","o":["석도-고종칙령 제41호","독도-심흥택 보고서","인접해양주권선언-맥아더 라인 설정","태정관 지령-외 1도는 일본과 관계없음을 명심"],"a":2,"e":["인접해양주권선언에 의해 설정된 것은 이승만 라인이다."]},{"id":"1-85","set":1,"n":85,"q":"다음 연결 중 틀린 것은?","o":["시마네현 고시 제40호-무주지 선점","한일어업협정-중간수역","포츠담 선언-폭력과 탐욕","평화선 선언-독도의 외측"],"a":2,"e":["“카이로 선언”에 일본은 폭력과 탐욕에 의해 약취한 영토로부터 축출된다고 규정하고 있다."]},{"id":"1-86","set":1,"n":86,"q":"대일평화조약에 관해 틀린 설명은?","o":["48개 연합국과 일본 간에 체결되었다.","일본이 한국의 독립을 승인한다는 규정이 있다.","“한일합병조약”이 무효라는 명문규정을 두고 있다.","독도가 일본의 영토라는 명문규정이 없다."],"a":2,"e":["“한일합방조약”이 무효라는 명문규정은 없다."]},{"id":"1-87","set":1,"n":87,"q":"“대일평화조약” 상 ‘SCAPIN 제677호’의 효력에 관해 옳은 것은?","o":["SCAPIN 제677호의 효력을 부인했다.","SCAPIN 제677호의 효력을 승인했다.","SCAPIN 제 677호의 효력을 부인도 승인도 하지 아니했다.","SCAPIN 제677호의 효력을 무효화했다."],"a":1,"e":["“대일평화조약(샌프란시스코 조약)” 제19조(d)항은 점령군 당국이 실시한 조치의 유효함을 승인하고 있다."]},{"id":"1-88","set":1,"n":88,"q":"‘대한제국칙령 제 41호’와 관계있는 것은?","o":["삼봉도","석도","가지도","우산도"],"a":1,"e":["삼봉도는 성종 때, 가지도는 정조 때, 우산도는 태종 때 각각 사용된 독도의 이름이다. ‘대한제국칙령 제41호’ 제2조는 “울릉도를 울도군으로 승격시키고, 군청의 위치는 태하동으로 정하고, 관할구역은 울릉전도와 죽도, 석도이다”라고 규정하고 있다."]},{"id":"1-89","set":1,"n":89,"q":"‘SCAPIN 제677호’에 일본의 통치로부터 제외된다고 규정을 둔 것은?","o":["독도, 울릉도","제주도","울릉도","제주도, 울릉도, 독도"],"a":3,"e":["“SCAPIN 제677호”에 일본의 통치로부터 제외된다는 규정을 둔 것은 제주도, 울릉전도, 독도이다(제3항)"]},{"id":"1-90","set":1,"n":90,"q":"독도가 한국의 땅임이 표시되어있는 ‘한국전도’는 어디에 수록되어 있나?","o":["『일로전쟁실기』","조선동해안도","『동국여지승람』","조선여지도"],"a":0,"e":["‘한국전도’는 『일로전쟁실기』에 수록된 지도로, 이에 독도가 한국의 땅임을 표시하고 있다."]},{"id":"1-91","set":1,"n":91,"q":"울릉도와 독도 사이에 있는 해산의 이름은?","o":["이사부 해산","심흥택 해산","안용복 해산","이규원 해산"],"a":2,"e":["(p.15, 16 그림 참고) : 울릉도와 독도 사이에 안용복 해산이 있고, 독도 서남쪽에 심흥택 해산, 독도 동쪽에 이사부 해산이 있다."]},{"id":"1-92","set":1,"n":92,"q":"“무릉과 우산은 모두 우산국의 땅이다”라고 기록되어 있는 것은?","o":["『고려사』","『삼국사기』","『중보문헌비고』","심흥택 보고서"],"a":2,"e":["(p. 36) : 『중보문헌비고』에는 “무릉과 우산은 모두 우산국의 땅이다”라고 기록되어 있다.","-『중보문헌비고』 : ‘『여지지』에 이르기를, ’울릉과 우산은 모두 우산국 땅인데, 우산은 왜인들이 말하는 송도(松島:마쓰시마)이다.‘"]},{"id":"1-93","set":1,"n":93,"q":"다음 연결 중 잘못된 것은?","o":["심흥택 보고서-독도","대한제국칙령 제 41호-석도","이규원-울릉도 검찰보고","고종-쇄환정책 수립"],"a":3,"e":["고종은 이규원 검찰사의 보고에 따라 쇄환정책을 폐지했다."]},{"id":"1-94","set":1,"n":94,"q":"독도 명칭의 최초 사용과 관계있는 사람은?","o":["이사부","안용복","심흥택","이규원도과거대회 예상문제 100"],"a":2,"e":["1906년 3월 28일 은기도(오끼섬)사의 독도 편입 통지를 받은 울릉군수 심흥택은 3월 29일 일본의 독도침탈 시도를 조정에 보고하면서(심흥택 보고서) ‘독도’라는 명칭을 최초로 사용했다."]},{"id":"1-95","set":1,"n":95,"q":"“울릉도와 독도가 일본과는 관계가 없음을 명심할 것”이라고 기록되어 있는 것은?","o":["은주시청합기","태정관지령문","조선국교제시말내탐서","안용복 심문서"],"a":1,"e":["1877년 태정관지령은 울릉도와 독도가 일본의 땅인지에 대한 내무성의 공문에 대해 “울릉도와 독도는 일본과 관계없음을 명심할 것”이라고 지시되어 있다."]},{"id":"1-96","set":1,"n":96,"q":"“우산, 무릉 두섬이 서로 거리가 멀지 아니하여 날씨가 맑으면 가히 바라볼 수 있다”라고 기록되어 있는 것은?","o":["심흥택 보고서","『고려사』","『세종실록지리지』","『삼국사기』"],"a":2,"e":[]},{"id":"1-97","set":1,"n":97,"q":"다음 ( )를 완성하시오.\n이사부의 우산국 정복은 ( A )년에 있었고, ‘대한제국칙령 제41호’의 제정․공포는 ( B )년에 있었다.","o":["A: 552  ·  B: 1900","A: 522  ·  B: 1910","A: 513  ·  B: 1905","A: 512  ·  B: 1900"],"a":3,"e":["이사부의 우산국 정복은 512년에 있었고, ‘대한제국칙령 제41호’의 제정․공포는 1900년 10월 25일에 있었다."]},{"id":"1-98","set":1,"n":98,"q":"다음 ( )를 완성하시오.\n대한제국칙령 제41호의 제정․공포일은 ( A )이고, 시마네현 고시 제40호의 고시일은 ( B )이다.","o":["A: 1900년 10월 25일  ·  B: 1900년 2월 20일","A: 1900년 10월 25일  ·  B: 1905년 2월 22일","A: 1905년 10월 25일  ·  B: 1900년 2월 2일","A: 1900년 9월 25일  ·  B: 1905년 2월 12일"],"a":1,"e":["대한제국칙령 제41호의 제정․공포일은 1900년 10월 25일이고 시마네현 고시 제40호의 고시일은 1905년 2월 22일이다."]},{"id":"1-99","set":1,"n":99,"q":"다음 중 연대순으로 열거된 것은?\nA. 이사부 우산국 정복   B. 안용복 도일활동\nC. 우용정 검찰보고   D. 심흥택 보고\nE. 고종칙령 제41호","o":["A, B, C, D, E","A, B, D, C, E","A. B, E, C, D","A, B, C, E, D"],"a":3,"e":["이들이 연대순서는 다음과 같다.","-이사부 우산국 정복 – 512년 6월","-안용복 도일활동-1693년 3월","-우용정 검찰보고-1900년 6월","-고종칙령 제41호-1900년 10월","-심흥택 보고서-1906년 3월"]},{"id":"1-100","set":1,"n":100,"q":"대한제국칙령 제41호의 제정․공포일은?","o":["1905년 10월 25일","1900년 10월 25일","1903년 10월 25일","1900년 9월 20일"],"a":1,"e":["‘대한제국칙령 제41호’의 제정․공포일은 1900년 10월 25일이다."]},{"id":"2-1","set":2,"n":1,"q":"다음 연결 중 틀린 것은?","o":["폭력과 탐욕-카이로 선언","천연기념물-지정명칭","자산도-『숙종실록』","한일어업협정-중간수역"],"a":1,"e":["천연기념물은 ‘지정종별’이고, 지정명칭이 아니다. 지정명칭은 독도천연보호구역이다. 자산도는 『숙종실록』 숙종 22년 9월 기록에 나와있다. 천연기념물은 지정종별이고 지정번호는 제336호이다.","-천연기념물 : 독도는 1982년 11월 4일에 천연기념물(지정종별) 제336호(지정번호), 해조류번식지(지정명칭)로 지정되었다. 그러다가 1999년 12월 1일 지정명칭만을 ‘독도천연구역’으로 변경했다.","-카이로 선언(p.57) : 제 2차 세계 대전이 막바지에 접어들면서 미국, 영국, 중국의 수뇌는 1943년 11월 22일부터 26일까지 이집트 카이로에서 회담을 가졌다. 이 회담에서 전후 일본의 영토 처리에 관한 연합국의 기본 방침과 한국의 독립 문제가 언급되었다. 3개국 수뇌가 서명한 카이로 선언은 일본이 “폭력 및 탐욕으로 빼앗은 일체의 지역으로부터 물러나야 한다”라고 하였고, 또한 “한국민이 노예 상태임에 유의하여 한국을 자유롭고 독립된 국가로 할 결의를 다진다.”라고 했다.","-숙종실록 30권 : 숙종(1674~1720) 22년(1696)의 기록이 담긴 권30에는 안용복이 1693년(숙종19) 울릉도에서 일본 어부들에게 납치되어 일본에 끌려간 일, 그리고 에도막부로부터 울릉도와 독도가 우리나라 땅이라는 서계를 받아 왔다는 진술과 ‘울릉도 쟁계’에 관한 기술이 담겨 있다. 그 내용을 오늘 말로 해석해보면 “제가(안용복 자신) 앞장 서서 말하기를, ‘울릉도는 본디 우리 지경인데, 왜인이 어찌하여 감히 지경을 넘어 침범하였는가? 너희들을 모두 포박하여야 하겠다.’하고, 이어서 뱃머리에 나아가 큰소리로 꾸짖었더니, 왜인이 말하기를, ‘우리들은 본디 송도(松島)에 사는데 우연히 고기잡이 하러 나왔다. 이제 본소(本所)로 돌아갈 것이다.’하므로, ‘송도는 자산도(子山島)로서, 그것도 우리 나라 땅인데 너희들이 감히 거기에 사는가?’하였습니다. 드디어 이튿날 새벽에 배를 몰아 자산도에 갔는데, 왜인들이 막 가마솥을 벌여 놓고 고기 기름을 기다리고 있었습니다.” ⇒ 송도(마쓰시마)는 그 당시 일본이 독도를 이르는 말, 자산도 또한 우리나라에서 독도를 불렀던 이름으로 우산도(于山島)와 한자와 유사하여 자산도로 와전된 것으로 보인다."]},{"id":"2-2","set":2,"n":2,"q":"‘SCAPIN 제677호’상 독도의 표기는?","o":["Dokdo","Dock-do","Liancourt RK(TAKE)","Dokdo Islands"],"a":2,"e":["‘SCAPIN 제677호’ 제 3항은 독도를 Liancourt RK(TAKE)로 규정하고 있으며 동 지령에 첨부된 지도에는 TAKE로 표기되어 있다.","-1946년 1월 연합국이 발표한 '일본의 일부 주위지역의 정부 및 행정적 분리'(Governmental and Administrative Separation of Certain Outlying Areas from Japan.)에 관한 지령. 이 문서의 가장 큰 의의는 독도의 언급일 것이다. 본 지시의 목적을 위해, 일본국은 일본 열도를 구성하는 4개의 주요섬(혼슈, 규슈, 시코쿠, 홋카이도)과 쓰시마, 북위 30도 이북에 있는 류쿠 제도 등을 포함한 1000여개의 부속 도서만을 보유한다; 울릉도, 독도, 제주도, 북위 30도이남의 류큐 제도, Izu, Nanpo, Bonin 섬과 유황도, 모든 태평양 부속제도와 쿠릴 열도, 하보마이 제도는 포함되지 않는다.","⇒ 그리고 제외되는 섬을 나열할 때 명칭을 보면 다음과 같다 ‘鬱陵島·리앙쿠르岩(Liancourt Rocks ; 獨島, 竹島)·濟州島 등이다” 고 규정하여 '독도'(Liancourt Rocks, 竹島) 등을 일본영토에서 분리한다고 명확하게 규정했다. 독도를 ’Liancourt Rocks‘, ’獨島(독도)‘, ’竹島(죽도:다케시마)‘라고 다양하게 부르고 있다. 이는 그 당시 독도를 부르는 명칭이 서양, 일본, 한국에서 모두달랐기에 서로 해석의 편의를 위해 모든 명칭을 사용했을 것이다."]},{"id":"2-3","set":2,"n":3,"q":"다음 연결 중 무관한 것은?","o":["SCAPIN 제 677호-일본통치권에서 독도 배재","한일어업협정-동해 중간수역","이승만 라인-국무원고시 제14호","SCAPIN 제 1033호-독도 60해리 접근금지"],"a":3,"e":["SCAPIN 제1033호는 일본 선박과 인원의 독도 12해리 이내에의 접근을 금지하고 있다."]},{"id":"2-4","set":2,"n":4,"q":"유엔해양법상 중첩 배타적 경제수역의 해결은 다음 중 어떤 해결을 하여야 하나?","o":["합리적 해결","정당한 해결","형평한 해결","합법적 해결"],"a":2,"e":["동 협약 제 77조는 합의에 의한 형평한 해결(egu : table solution)을 하여야 한다고 규정하고 있다.","-맥아더 라인(p. 61) : 제2차 세계 대전이 끝난 후 일본을 점령 통치하던 연합국 최고사령관 총 사령부가 1946년 6월각서 제 1033호(SCAPIN 제1033호)로 ‘일본의 어업 및 포경업 허가구역’을 선포하여 일본 선박의 어로 활동 범위를 제한할 때 설정된 선이다. 당시 연합국 최고사령관 더글라스 맥아더의 이름을 따서 ‘맥아더 라인’이라고 부른다. 즉 ‘맥아더 라인’은 일본의 어업을 제한하는 효과가 있었다. 연합국 각서 제 1033호 제 3항은 “일본선박과 국민의 독도의 12해리 이내 접근을 금지하고 있다. 1952년 4월 28일 샌프란시스코 강화조약이 발효되면 맥아더 라인이 폐지되어 일본 어선이 몰려들 것으로 예상되었기 때문에 우리나라 어업을 보호하고자 평화선(이승만 라인)을 설정하였다."]},{"id":"2-5","set":2,"n":5,"q":"다음 연결 중 틀린 것은?","o":["태정관 지령문-죽도 외 1도의 건에 대해서는 일본과 관계없음을 명심할 것","은주시청합기-일본의 서북쪽 경계는 이주(오끼시마)를 경계로 한다.","조선국교제시말내탐서-송도의 건에 관해서는 지금까지 게재된 서류가 없다.","삼국접양도-일본영토는 적색으로, 조선영토는 청색으로 착색하고 울릉도와 독도를 청색으로 착색했다."],"a":3,"e":["삼국접양도는 조선영토는 황색으로 착색하고 울릉도와 독도를 황색으로 착색했다."]},{"id":"2-6","set":2,"n":6,"q":"“울릉도와 우산도가 모두 우산국의 땅이다”라고 기록되어 있는 것은?","o":["『만기요람』","『동문비고』","『삼국사기』","『고려사』"],"a":0,"e":["『만기요람』 군정 편에 울릉도와 우산도는 우산국의 영토라고 기록되어 있다.","-『만기요람』(p. 36) : 『만기요람』 군정편에는 \"울릉도와 우산도는 '모두' 우산국 땅\", \"우산도는 왜인들이 말하는 송도이다\"라고 기록되어 있는데 전자는 울릉도와 우산도가 모두 우산국의 영토임을, 후자는 우산도가 독도임을 밝히는 것이다. 1870녀대 말까지 일본은 조선의 울릉도를 '죽도(다께시마)', 독도를 '송도'로 호칭하였다. 이것은 일본의 모든 학자들도 인정하는 사실이다."]},{"id":"2-7","set":2,"n":7,"q":"다음 연결 중 틀린 것은?","o":["대한제국칙령 제41호-석도","심흥택 보고서-독도","숙종실록-자산도","SCAPIN 제677호-Dokdo"],"a":3,"e":["SCAPIN 제677호 제3항에는 Liancourt RK(TAKE)으로 규정되어 있다."]},{"id":"2-8","set":2,"n":8,"q":"‘시마네현 고시 제40호’에 독도의 명칭은 무엇이라고 규정되어 있나?","o":["마쓰시마","다케시마","리앙끄르암","석도"],"a":1,"e":["(p. 51, 53) 시마네현 고시 제 40호에는 다케시마로 규정되어 있다.일본의 시마네현 지사는 내무대신의 지시에 따라 1905년 2월 22일 시마네현 『현보縣報』 에 조그맣게 게재하고, 이 고시22 사실 내용을 『산음신문山陰新聞』(1905년 2월 24일자)이 조그맣게 보도했다. 그 고시문은 다음과 같다. \"북위 37도 9분 30초, 동경 131도 55분, 은기도로부터의 거리가 서북으로 85해리에 있는 섬을 죽도(다케시마)라고 칭하고 지금 이후부터는 본현 소속 은기도사(隱岐島司)의 소관으로 정한다“라고 하였다."]},{"id":"2-9","set":2,"n":9,"q":"독도와 관련한 다음 연결 중 관계없는 것은?","o":["1~96 : 독도리 번지","366 : 천연기념물 지정번호","460 : 460만 년 전 형성","799-805 : 우편번호"],"a":1,"e":["독도는 천연기념물 지정번호 제336호로 지정되었다. 1~96은 독도리의 번지수이고, 460은 460만년 전에 독도가 형성된 것과 관련된 것이고, 799-805는 독도의 우편번호이다."]},{"id":"2-10","set":2,"n":10,"q":"독도에 최초로 주민등록한 사람은?","o":["1981년 10월 14일 최종덕","1981년 10월 1일 조준기","1987년 11월 2일 송재욱","1981년 10월 14일 송재욱"],"a":0,"e":["독도에 최초로 주민등록을 한 사람은 1981년 10월 14일 최종덕 씨이며, 독도에 최초로 호적을 옮긴 사람은 1987년 11월 2일 송재욱씨이다."]},{"id":"2-11","set":2,"n":11,"q":"SCAPIN은?","o":["Supreme Command of the Army Power","Supreme Commander for the Allied Power Instruction","Super Command of Air Powers Inspection","Supreme Command of the All Post"],"a":1,"e":["(p. 58)연합군 최고사령부 지령이다. 원래는 연합국 최고사령관 각서에 부여된 일련 번호인 ‘연합국 최고사령관 각서 색인번호(Supreme:최고 Com-mander:사령관        for the Allied:동맹한, 연합한 powers Index Number)’의 약칭이지만, 연합국 최고사령관 총사령부가 일본 정부에 내린 포고, 명령 및 지령(Supreme Commander for the Allied Powers Directives   to the Japanese Government)을 간단히 ‘SCAPIN’이라 하고 ‘연합국 최고사령관 각서’라고 번역한다."]},{"id":"2-12","set":2,"n":12,"q":"다음 설명 중 틀린 것은?","o":["독도는 12해리의 영해를 갖는다.","대한민국의 영토의 동단은 동도의 동단이며, 이는 경도 동경 131°52′22″이다.","한일 간의 배타적 경제수역의 경계는 독도와 오끼섬의 중간선으로 한일간에 합의를 보았다.","성종 때는 독도를 삼봉도라고 불렀다."],"a":2,"e":["한일 간에 중첩된 배타적 경제수역의 경계에 관해 아직 한일 간에 합의를 보지 못하고 있다."]},{"id":"2-13","set":2,"n":13,"q":"다음 ( )를 완성하시오.\n일본은 ( A )에 시마네현 고시 ( B )를 고시하여 ( C)인 독도를 ( D )취득했다고 주장했다.","o":["A: 1900년 2월 22일  ·  B: 제40호  ·  C: 무인  ·  D: 발견","A: 1905년 2월 22일  ·  B: 제40호  ·  C: 무주지  ·  D: 선점","A: 1900년 10월 25일  ·  B: 제30호  ·  C: 유인  ·  D: 시효","A: 1900년 10월 25일  ·  B: 제40호  ·  C: 유인  ·  D: 역사적 응고"],"a":1,"e":["일본은 1905년 2월 22일 시마네현 고시 제40호로 무주지인 독도를 선점취득했다고 주장했다."]},{"id":"2-14","set":2,"n":14,"q":"다음 기술 중 틀린 것은?","o":["한일어업협정은 한일 양국의 어업수역에 적용된다.","한일어업협정은 동해 중간수역을 설정했다.","독도는 동해 중간수역 내에 위치하고 있다.","한일 간에 배타적 경제수역의 경계가 획정되게 되면 중간수역은 소멸하게 된다."],"a":0,"e":["“한일어업협정”은 한일 양국의 배타적 경제수역에 적용된다."]},{"id":"2-15","set":2,"n":15,"q":"다음 기술 중 틀린 것은?","o":["중간수역에는 기국주의가 적용된다.","중간수역 내의 일본 어선과 국민에 대해 한국은 관할권이 없다.","한국은 중간수역 내의 일본어선이 한국의 법령을 위반해도 이에 대해 관할권이 없다.","일본은 중간수역 내의 일본 선박과 인원에 대해서만 관할권을 가지지 아니한다."],"a":3,"e":["기국주의에 따라 일본은 일본 선박과 국민에 대해서만 관할권을 갖는다."]},{"id":"2-16","set":2,"n":16,"q":"한일어업협정이 적용되지 아니하는 해역은?","o":["독도의 배타적 경제수역","오끼섬의 배타적 경제수역","울릉도의 배타적 경제수역","독도의 영해"],"a":3,"e":["“한일어업협정”은 한일 양국의 배타적 경제수역에 적용된다. 영해와 접속수역에는 적용되지 아니한다.(제1조)"]},{"id":"2-17","set":2,"n":17,"q":"대한제국칙령 제40호상 울릉군수의 관할은?","o":["울릉전도, 죽도, 석도","울릉도, 석도","울릉전도, 석도","울릉도, 죽도"],"a":0,"e":["‘대한제국칙령 제40호’ 제2조는 울릉군수의 관할로 ‘울릉전도, 죽도, 석도’를 규정하고 있다."]},{"id":"2-18","set":2,"n":18,"q":"독도는 다음 중 어떤 도서로 지정되었나?","o":["특수도서","특종도서","특정도서","특근도서"],"a":2,"e":["2000년 9월 환경부는 「독도 등 특정도서의 생태계보호에 관한 특별법」에 의거, 환경부고시로 독도를 ‘특정도서’로 지정하여 독도의 자연환경과 생태계의 보전을 위해 힘쓰고 있다."]},{"id":"2-19","set":2,"n":19,"q":"“원록9 병자년(숙종 22년, 1696년) 조선주착안일권지각서” 강원도에 기록된 것은?","o":["이도(강원도) 중 죽도와 송도가 있다.","이도(경상북도) 중 죽도와 울도가 있다.","이도(강원도) 중 우산도와 송도가 있다.","이도(강원도) 중 울도와 죽도가 있다."],"a":0,"e":["“원록9 병자년 조선주착안일권지각서”는 일본관헌이 안용복을 심문하면서 안용복이 가져간 ‘조선팔도지도’를 보고 옮겨 적은 부분이다. 이에는 강원도 밑에 ‘此道中 竹島松島有(차도중 죽도송도유: 이 지역에 죽도와 송도가 있다 정도로 해석)’라고 기록되어 있다."]},{"id":"2-20","set":2,"n":20,"q":"죽도지서부(竹島之書附)는 다음 무엇에 관한 문서인가?","o":["죽도의 수산물","죽도의 거리","죽도의 기후","죽도의 조류"],"a":1,"e":["“죽도지서부”는 1696년 1월 25일 독도지번이 막부에 제출한 오끼시마와 마쓰시마(독도)까지, 마쓰시마(독도)에서 다케시마(울릉도)까지의 거리를 조사한 보고문서이다."]},{"id":"2-21","set":2,"n":21,"q":"유엔지명표준화위원회에서 동해의 표기에 관해 한국 정부의 공식 주장은?","o":["한국해","동해","한국해/일본해","동해/일본해"],"a":3,"e":["유엔지명표준화위원회에서 한국 정부는 동해를 ‘동해/일본해’로 표기할 것을 제의했다."]},{"id":"2-22","set":2,"n":22,"q":"다음 ( )를 완성하시오.\n2008년 8월 4일 정부 각 부처 간의 독도문제 협의를 위해 국무총리 산하에 ( A )로 ( B )를 설치했다.","o":["A: 대통령령 제517호  ·  B: 정부합동 독도연구 관리 대책단","A: 국무총리령 제517호  ·  B: 합리적 독도 관리 협력 위원회","A: 국문총리훈령 제517호  ·  B: 정부합동 독도 영토 관리 대책단","A: 국무총리훈령 제417호  ·  B: 독도문제 협의조정 위원회"],"a":2,"e":["2008년 8월 4일 국무총리 훈령 제517호로 ‘정부합동 독도 영토관리 대책단’이 설치 운영되고 있다.","-국무총리 훈령 제517호제 1조(목적)우리나라의 독도 영토관리와 환경보전 관련 사항에 효율적으로 대응하기 위하여 정부 부처 간 공조체계를유지하고, 각 부처의 관련대책을 협의•조정하기 위하여 국무총리실에 정부합동독도영토관리대책단을 둔다.제2조(기능)우리나라의 독도 영토관리 공고화 사업에 관한 사항, 독도 및 주변수역의 환경보전에 관한 사항, 초•중•고등학교 등에서의 독도 교육 강화에 관한 사랑, 독도에 대한 국제사회의 이해증진을 위해 필요한 사항 등을 처리한다."]},{"id":"2-23","set":2,"n":23,"q":"‘아국총도’에 동해, 울릉도, 독도를 어떻게 표기하고 있나?","o":["동해, 울릉도, 우산도","조선해, 우산도, 울릉도","동해, 우산, 울중","동해, 우산, 울릉도"],"a":0,"e":["‘아국총도’는 정조대에 제작된 지도첩인 『여지도』에 수록된 전국지도다. 정상기의 동국지도를 따른 윤곽이 보이고 무엇보다 화려한 색채가 돋보인다. 산줄기를 녹색, 하천을 청색, 강원도는 푸른색, 황해도는 흰색, 전라도와 경상도는 붉은색, 함경도는 검은색, 경기도와 충청도는 황색 등으로 기록했다. 당시 도서 지역에 대한 관심이 증대되어 바다의 작은 섬까지 명확히 기록하고 있다. 바다는 동해, 서해, 남해로 표기하였고,      오늘날의 울릉도는 울릉도로, 오늘날의 독도는 우산도로 표기하고 있다."]},{"id":"2-24","set":2,"n":24,"q":"“해양과 바다의 경계”는 무엇을 가리키는가?","o":["유엔해양법협약 당사국회의 분과위원회의 명칭","한일어업협정에 의해 설치된 한일어업공동위원회의 명칭","유엔사령부가 한국전쟁 간에 설치한 북한과의 해양경계의 명칭","국제수로기구(IHO)가 발간한 책자의 명칭"],"a":3,"e":["『해양과 바다의 경계』는 국제수로기구가 발간하는 책자로, 1929년판, 1937년판, 1953년판 모두에 동해를 일본해(Japan Sea)로 표기하고 있다."]},{"id":"2-25","set":2,"n":25,"q":"다음 ( )를 완성하시오.\n( A )의 ( B )는 일본의 선박 및 국민의 독도주변 ( C) 이내에의 접근을 금지했다.","o":["A: 1945.8.15.  ·  B: SCAPIN 제677호  ·  C: 12해리","A: 1945.9.12.  ·  B: SCAPIN 제677-1호  ·  C: 24해리","A: 1946.6.22.  ·  B: SCAPIN 제1033호  ·  C: 12해리","A: 1946.1.29  ·  B: SCAPIN 제1033호  ·  C: 12해리"],"a":2,"e":["1946년 6월 22일의 ‘SCAPIN 제1033호’는 일본선박 및 국민의 독도 주변 12해리 이내에 접근을 금지했다.(2ㅔ3항 )"]},{"id":"2-26","set":2,"n":26,"q":"정상기가 그린 지도의 이름은?","o":["동국지도","팔도지도","조선전도","아국총도"],"a":0,"e":["영조시대 정상기가 그린 ‘동국지도’에서 우산도(독도)는 울릉도의 우측에 그려져 있다."]},{"id":"2-27","set":2,"n":27,"q":"다음 설명 중 틀린 것은?","o":["독도등대는 동도에 있다.","독립문바위는 동도에 있다.","동도와 서도 간에 폭 110~160m, 길이 330m의 물길이 있다.","독도에서 가장 높은 곳은 동도 정상부로 해발 168.5m이다."],"a":3,"e":["독도에서 가장 높은 곳은 서도의 정상부로 168.5m이다."]},{"id":"2-28","set":2,"n":28,"q":"다음 ( )를 완성하시오.\n증보문헌비고에는 ( A )과 ( B )은 모두 ( C ) 의 땅이라고 기록되어 있다.","o":["A: 울릉  ·  B: 가지  ·  C: 우산국","A: 울릉  ·  B: 우산  ·  C: 우산국","A: 울릉  ·  B: 가산  ·  C: 우산국","A: 울릉  ·  B: 무릉  ·  C: 우산국"],"a":1,"e":["『증보문헌비고』에는 울릉과 우산은 모두 우산국의 땅이라고 기록되어 있다.18세기 말에 엮어진 \"증정동국문헌비고\"를 수정, 보완하여 1908년 간행한 책으로 문물제도를 분류하여 정리한 책이다.31권의 「여지고 19)」의 울진에는 “우산도(于山島) 울릉도(鬱陵島) : 동쪽 3백 50리에 있다. 울(鬱)은 울(蔚)이라고도 하고, 우(芋)라고도 하고, 우(羽)라고도 하고, 무(武)라고도 하는데, 두 섬으로 하나가 바로 우산(芋山)이다. 속 지금은 울도군(鬱島郡)으로 되었다.”라고 독도와 울릉도에 대해 기술하고 있으며, \"동국문헌비고(1770년)\"와 마찬가지로 울릉도와 독도의 내력을 연대순으로 정리하였는데 안용복의 울릉도·독도 수호 사실을 상세히 기술하고 있다. (*속이라는 의미는 고종시대에서 첨부한 내용이다.)"]},{"id":"2-29","set":2,"n":29,"q":"다음 기술 중 틀린 것은?","o":["한국이 200해리 배타적 경제수역을 설정하고, 일본도 200해리 배타적 경제수역을 설정하여 한일 양국의 배타적 경제수역이 중첩하는 수역이 생기게 되었다.","중첩 배타적 경제수역의 경계획정에 양국의 주장이 일치하지 아니하여 이 문제를 해결할 때까지 “한일어업협정”을 체결했다.","“한일어업협정”은 독도 주위에 동해 중간수역을 설정하고 중간수역은 양국이 공동으로 관할하도록 규정하고 있다.","중간수역 내에서는 양국의 기국주의가 적용되며, 기국주의의 결과 양국은 중간수역 내에서 상대방 국가의 선박과 국민에 대해 관할권을 행사할 수 있게 되었다."],"a":3,"e":["양국은 각기 자국의 선박과 국민에 대해서만 관할권을 행사할 수 있게 되어 있다. (기국주의)"]},{"id":"2-30","set":2,"n":30,"q":"다음 ( )를 완성하시오.\n한일 양국은 배타적 경제수역의 경계획정에 관해 어떠한 기본입장을 견지하고 있나? 한국은 ( A )의 중간선을, 일본은 ( B )의 중간선을 각각 주장한다.","o":["A: 독도와 오끼섬  ·  B: 오끼섬과 울릉도","A: 독도와 울릉도  ·  B: 오끼섬과 울릉도","A: 독도와 오끼섬  ·  B: 독도와 울릉도","A: 독도와 울릉도  ·  B: 오끼섬과 울릉도"],"a":2,"e":["한국은 독도와 오끼섬의 중간선, 일본은 독도와 울릉도의 중간선을 각각 주장한다."]},{"id":"2-31","set":2,"n":31,"q":"독도와 울릉도가 본토와 같이 채색되지 아니한 지도는?","o":["개정 일본여지로정전도","삼국접양도","팔도총도","아국총도"],"a":0,"e":["개정 ‘일본여지로정전도’에는 울릉도와 독도를 본토와 같이 채색하지 않았다.","-‘일본여지로정전도’(p. 39) : 일본여지로정전도는 울릉도와 독도는 착색하지 않았다.","-일본여지로정전도 : 일본의 나가쿠보 세키스이가 제작한 지도로 일본의 영토는 채색을 했지만 ‘다케시마(竹島:울릉도),’마쓰시마(松島:독도)‘ 두 섬이 조선 본토와 함께 채색되지 않은 상태로 그려져 있어 일본 영역 밖의 섬으로 나타나 있다."]},{"id":"2-32","set":2,"n":32,"q":"독도에서 음료수를 얻을 수 있는 곳은?","o":["서도의 남쪽","서도의 북쪽","동도의 남쪽","동도의 북쪽"],"a":1,"e":["서도의 북쪽에 물골이 있어서 음료수를 얻을 수 있다."]},{"id":"2-33","set":2,"n":33,"q":"2000년 9월 5일 환경부는 환경부고시로 독도를 ‘특정도서 제1호’로 지정했다. 그 법적 근거는?","o":["「문화재보호법」","「독도 등 도서지역의 생태계보전에 관한 특별법」","「독도의 지속 가능한 이용에 관한 법률」","국무총리훈령 제 517호"],"a":1,"e":["환경부가 독도를 ‘특정도서’로 지정한 법적 근거는 「독도 등 도서지역의 생태계보전에 관한 특별법」이다."]},{"id":"2-34","set":2,"n":34,"q":"다음 (    )를 완성하시오.\n유엔해양법협약 제121조 제3항은 “인간이 ( A )할 수 없거나 ( B )을 유지할 수 없는 ( C )은/는 ( D )나 ( E )을 가지지 아니한다”라고 규정하고 있다.","o":["A: 생활  ·  B: 독자적 문화활동  ·  C: 암석  ·  D: 영해  ·  E: 접속수역","A: 상륙  ·  B: 독자적 인간활동  ·  C: 소도  ·  D: 영해  ·  E: 접속수역","A: 거주  ·  B: 독자적 경제활동  ·  C: 암석  ·  D: 배타적 경제수역  ·  E: 대륙붕","A: 거주  ·  B: 독자적 거래활동  ·  C: 소도  ·  D: 배타적 경제수역  ·  E: 대륙"],"a":2,"e":["2008년 8월 4일 국무총리 훈령 제 517호로 ‘정부합동 독도 영토관리 대책단’이 설치 운영되고 있다."]},{"id":"2-35","set":2,"n":35,"q":"“대일평화조약” 제2조 (a)항에 일본의 포기대상으로 명시된 섬은?","o":["제주도, 울릉도","제주도, 거문도, 울릉도","제주도, 울릉도, 독도","제주도, 거제도, 거문도, 이어도"],"a":1,"e":["“대일평화조약” 제2조 (a)항에 규정된 일본의 포기대상인 섬은 제주도, 거문도, 울릉도이다."]},{"id":"2-36","set":2,"n":36,"q":"일본이 한국의 독립을 승인한 것은?","o":["항복문서","포츠담 선언","대일평화조약","카이로 선언"],"a":2,"e":["“대일평화조약” 제2조 (a)항은 “일본은 한국의 독립을 승인하고…”라 규정하고 있다."]},{"id":"2-37","set":2,"n":37,"q":"독도등대의 광원거리는?","o":["20해리","25해리","30해리","50해리"],"a":1,"e":["동도에 위치한 유인등대의 광원거리는 25해리이다."]},{"id":"2-38","set":2,"n":38,"q":"우리 「헌법」상 모든 국민의 독도에 대한 의무는?","o":["독도방위","독도수호","독도보전","독도보호"],"a":0,"e":["「헌법」 제39조 제1항은 “모든 국민은 법률이 정하는 바에 의하여 국토방위의 의무를 진다.”라고 규정하고 있다. 독도는 우리의 국토이므로 모든 국민은 독도방위의 의무가 있다."]},{"id":"2-39","set":2,"n":39,"q":"다음 설명 중 틀린 것은?","o":["영토주권의 현시(display of territorial sovereignty)를 실효적 지배(effective control)라고 한다.","실효적 지배는 물리력의 행사에 한하지 아니한다. 따라서 법령의 재정•공포, 납세고지, 어업허가 등도 실효적 지배이다.","실효적 지배는 ‘점유에 의한 실효적 지배’와 ‘비점유에 의한 실효적 지배’로 구분된다. 독도에 경찰경비대의 주둔은 전자의 예이고 우표의 발행은 후자의 예이다.","독도를 천연문화재로 지정하는 행위는 실효적 지배가 아니다."],"a":3,"e":["독도를 천연기념물로 지정하는 행위는 ‘비점유에 의한 실효적 지배’이고, ‘비물리적인 행사’에 의한 실효적 지배이다. 천연기념물의 지정 등 법령의 적용도 실효적 지배이다."]},{"id":"2-40","set":2,"n":40,"q":"다음 설명 중 틀린 것은?","o":["실효적 지배는 이해관계국의 묵인이 있음을 요한다.","실효적 지배는 ‘권원의 대체’, ‘권원의 취득’ 그리고 ‘권원의 유지’를 위해서 요구된다.","독도는 한국의 영토이므로 독도에 대한 실효적 지배는 권원의 유지를 위해서 요구된다.","역사적 응고취득을 위한 실효적 지배는 권원의 대체를 위한 실효적 지배이다."],"a":3,"e":["역사적 응고취득을 위한 실효적 지배는 ‘권원의 취득’을 위한 실효적 지배이다."]},{"id":"2-41","set":2,"n":41,"q":"다음 ( )를 완성하시오.\n독일인 크라프로트(Klaproth)가 그린 ( A )에는 울릉도와 독도가 조선본토와 같은 ( B )색으로 착색되어 있다.","o":["A: 삼국접양도  ·  B: 청","A: 삼국전도  ·  B: 황","A: 삼국통합도  ·  B: 황","A: 조선전도  ·  B: 청"],"a":2,"e":["독일인 크라프로트가 그린 ‘삼국통합도’에는 울릉도와 독도를 조선본토와 같이 황색으로 채색하였다."]},{"id":"2-42","set":2,"n":42,"q":"동해 중간수역에 관해 다음 중 옳은 것은?","o":["중간수역은 공해 상에 설치되었다.","중간수역은 독도의 영해만을 내포하고 있다.","중간수역은 독도가 한국의 영토가 아닌 것을 전제로 한 것이다.","중간수역은 울릉도와 오끼섬 중간에 설치되었다."],"a":3,"e":["①중간수역은 한국과 일본의 배타적 경제수역에 설정된 것이며, 공해에 설치된 것이 아니다.","② 독도의 배타적 경제수역만을 내포하고 영해와 접속수역은 포함하고 있지 아니한다.","③ 중간수역은 독도가 한국의 영토이든 일본의 영토이든 이를 유보하고 실치된 것이다."]},{"id":"2-43","set":2,"n":43,"q":"한국이 독도의 배타적 경제수역에 대해 갖는 권리는?","o":["주권","주권적 권리","비주권적 권리","배타적 주권"],"a":1,"e":["연안국은 영해와 내해에 대해 ‘주권(sovereignty)’을 가지나 배타적 경제수역에 ‘주권적 권리(sovereign right)’를 갖는다. 따라서 한국은 독도의 배타적 경제수역에 대해 ‘주권’이 아니라 ‘주권적 권리’를 갖는다."]},{"id":"2-44","set":2,"n":44,"q":"‘울릉자산양도감세장(鬱陵子山兩島監稅將)은?","o":["세종 20년에 남회와 조민에게 수여한 관직","태종이 김인우에 부여한 울릉도 검찰관직","고려 인종이 이양실에게 부여한 관직","안용복이 제2차 도일 시 들고 간 기에 새겨진 것이다."],"a":3,"e":["‘울릉자산양도감세장’은 안용복이 제2차 도일 시 들고 간 기에 새겨진 것이다."]},{"id":"2-45","set":2,"n":45,"q":"고려 현종은 현종 9년(1018년) 11월에 누구를 울릉도에 파견하여 농구(農具:농기계)를 지원했나?","o":["이원구","백길","이양익","토두"],"a":0,"e":["현종은 울릉도에 ‘이원구’를 파견하여 농구를 지원해 주었다."]},{"id":"2-46","set":2,"n":46,"q":"다음 설명 중 틀린 것은?","o":["독도는 460만 년 전에 화산폭발로 형성되었다.","독도의 해저지형은 해수면 아래 높이 2,000m 하부지른 20~25km의 봉우리 형태로 솟아있다.","울릉도와 독도 사이에 안용복 해산이 있다.","심흥택 해산은 제3 독도 해산이라 한다."],"a":3,"e":["심흥택 해산은 제2독도 해산이라 한다. 독도에서 동남쪽으로 15km 떨어진 곳에 심흥택 해산(제2독도 해산)이있고 55km 떨어진 곳에 이사부 해산(제3독도 해산)이 있다."]},{"id":"2-47","set":2,"n":47,"q":"광개토왕릉비의 비문에 동해의 표기는?","o":["고구려 동해","고구려해","동해","고구려 일본해"],"a":2,"e":["광개토왕릉비의 비문에 ‘동해’로 표기되어 있다."]},{"id":"2-48","set":2,"n":48,"q":"다음 중 독도를 울릉도의 서쪽에 표기한 지도는?","o":["동국지도","여지도","동국전도","팔도총도"],"a":3,"e":["천하대총일람도와 팔도총도는 독도를 울릉도의 서쪽에 표기한 지도이다. 동국지도, 여지도, 동국지도, 조선전도,청구도 등은 독도를 울릉도의 동쪽에 표기한 지도이다."]},{"id":"2-49","set":2,"n":49,"q":"다음 ( )를 완성하시오.\n독도와 울릉도는 ( A )로 연결되어 있고 ( B )로 구성되어 있다.","o":["A: 해산  ·  B: 조연암","A: 화산  ·  B: 화강암","A: 해산  ·  B: 석회암","A: 해산  ·  B: 화산암"],"a":0,"e":["울릉도와 독도는 해산으로 연결되어 있고 조연암으로 구성되어 있다."]},{"id":"2-50","set":2,"n":50,"q":"다음 ( )를 완성하시오.\n고려 ( A )은 여진족의 ( B ) 침범에 대해 ( C )를 보내 농기구를 지원해 주었다.","o":["A: 현종  ·  B: 우산도  ·  C: 이원구","A: 태조  ·  B: 우산국  ·  C: 이원구","A: 현종  ·  B: 우산국  ·  C: 이원구","A: 덕종  ·  B: 우산도  ·  C: 이원구"],"a":2,"e":["고려 현종은 울릉도에 대해 시혜통치를 했다. 현종 9년(1018년) 여진족의 우산국 침범에 대해 이원구를 파견하여 농기구 등을 지원해 주었다고 『고려사』에 기록되어 있다 ."]},{"id":"2-51","set":2,"n":51,"q":"‘팔도총도’에 동해, 울릉도, 독도를 어떻게 표시하고있나?","o":["동해-울릉도-우도","동해-울릉-우산","팔도해-울릉도-우산도","동해-우산도-울릉도"],"a":3,"e":["『신증동국여지승람』에 첨부된 “팔도총도”에는 ‘동해’, ‘울릉도’, ‘우산도’로 표기되어 있다.그림 3 . 신증동국여지승람에 수록된 ‘팔도총도’한국에서 제작된 지도 가운데 처음으로 동해 표기가 나타난 ‘팔도총도’. 1530년 중종의 명을 받아 이행 윤은보 신공제 등이 펴냈다. 한국의 지도에 나타난 것은 이때지만 중국 사서에서는 춘추전국시대 이래 줄곧 한반도 동쪽의 바다가 ‘동해’로 표현돼 왔다. 또 우산도(독도)의 위치가 울릉도의 서쪽에 잘못 표기되기는 했으나 독도의 존재를 명확히 알고 있었음을 알 수 있다."]},{"id":"2-52","set":2,"n":52,"q":"다음 연결 중 잘못된 것은?","o":["광개토대왕릉비문 - 동해","중간수역 - 기국주의","대한제국칙령 제41호 - 석도","평화선 – 미국의 동의"],"a":3,"e":["평화선을 선고한 후 일본, 영국, 미국 등으로부터 항의를 받았다."]},{"id":"2-53","set":2,"n":53,"q":"“항복문서”의 설명 중 틀린 것은?","o":["서명은 동경만에 정박 중인 미전함 미조리함 상에서 있었다.","일본은 포츠담 선언을 수락했다. 이로써 “카이로 선언”은 일본에 대해 법적 구속력을 갖게 되었다.","일본은 그가 폭력과 탐욕에 의해 취득한 영토로부터 축출된다는 “카이로 선언”의 규정이 일본에 대해 법적 구속력을 갖게 되었다. 따라서 일본이 폭력과 탐욕에 의해 취득한 독도로부터 일본이 축출되어 독도는 한국의 영토로 된 것이다.","그러나 “카이로 선언”의 이 규정은 “대일평화조약”의 해석의 기준이 될 수 없다."],"a":3,"e":["“항복문서”에 의거하여 “대일평화조약”이 체결된 것으로 “항복문서”는 “대일평화조약”의 해석기준이 된다."]},{"id":"2-54","set":2,"n":54,"q":"‘시마네형 고시 제40호’의 고시 사실을 일본 측이 1906년 3월 28일 우리 측에게 통고해 온 것은 누구인가?","o":["동문보(東文輔:마즈마분스케)","중정삼량(中丼三良:나가사키 요오시부로)","송영무길(松永武吉:마쓰사가 다케요시)","대곡심길(大谷甚吉:요오이로 진키치)"],"a":0,"e":["일본 측이 우리 측 울릉도군수 심흥택에게 통보해 온 것은 1906년 3월 28일 오끼도사 동문보로부터였다."]},{"id":"2-55","set":2,"n":55,"q":"‘독도에 입도하려면 7일 전에 입도신고를 해야 한다’ 고 규정된 곳은?","o":["경상북도 조례","울릉군 규칙","울릉군 조례","문화재청 규칙"],"a":2,"e":["독도에 입도하려면 7일 전에 입도신고서를 제출하여야 한다고 「울릉군 조례」에 규정되어 있다.(울릉군 조례 제 1500호)"]},{"id":"2-56","set":2,"n":56,"q":"독도우편번호의 지정에 관해 틀린 것은?","o":["대한민국의 독도에 대한 실효적 지배이다.","비점유에 의한 실효적 지배이다.","행정기관에 의한 실효적 지배이다.","유형적 실효적 지배이다."],"a":3,"e":["독도우편번호의 지정은 무형적 실효적 지배이다."]},{"id":"2-57","set":2,"n":57,"q":"다음 중 일본이 서명한 것은?","o":["카이로 선언, 대일평화조약","포츠담 선언, 항복문서","항복문서, 대일평화조약","카이로 선언, 포츠담 선언"],"a":2,"e":["“항복문서”와 “대일평화조약”에 일본은 서명했다. “카이로 선언”과 “포츠담 선언”에 일본은 서명한 바 없다."]},{"id":"2-58","set":2,"n":58,"q":"독도의 도로명에 관해 옳은 것은? (동도 / 서도 순)","o":["동도: 독도 이사부길  ·  서도: 독도 안용복길","동도: 독도 이사부길  ·  서도: 독도 심흥택길","동도: 독도 안용복길  ·  서도: 독도 이사부길","동도: 독도 심흥택길  ·  서도: 독도 이사부길"],"a":0,"e":["동도에는 ‘독도 이사부길’, 서도에는 ‘독도 안용복길’이 설정되었다."]},{"id":"2-59","set":2,"n":59,"q":"다음 설명 중 틀린 것은?","o":["신라 지증왕 13년(512년)에 신라 이사부 장군이 우산국을 정복하여 한국은 독도에 대한 역사적 권한 취득했다.","조선 태조에 의해 수립된 쇄환정책은 대한제국 고종에 의해 강화되었다.","1910년 8월 “한일합방조약”에 의해 독도를 포함한 조선의 전 영토가 일본에 귀속되었다.","1945년 일본의 항복, ‘SCAPIN 제677호’ 그리고 “대일평화조약”으로 독도를 포함한 모든 한국의 영토가 일본에서부터 분리되게 되었다."],"a":1,"e":["고종은 우용정의 보고에 따라 쇄환정책을 폐기하였다."]},{"id":"2-60","set":2,"n":60,"q":"독도를 ‘TAKE’로 표기한 것은?","o":["시마네현 고시 제 40호","“대일평화조약”에 첨부된 지도","삼국총도","SCAPIN 제 677호에 첨부된 지도"],"a":3,"e":["‘SCAPIN 제677호’ 제3항에는 독도를 ‘Liancourt RK(TAKE)’로 표기했으나, 첨부된 지도에는 독도와 울릉도를 한국의 영토 경계선 내에 표시했고 독도를 TAKE로 표시했다."]},{"id":"2-61","set":2,"n":61,"q":"다음 중간수역에서 제외되는 것 중 옳은 것은?","o":["독도의 배타적 경제수역","독도의 영해와 접속수역","독도의 어업수역","독도의 접속수역"],"a":1,"e":["“한일어업협정”은 한국과 일본의 배타적 경제수역에 적용되므로 독도의 영해에는 동 협정이 적용되지 아니한다. 따라서 중간수역에서 제외된다."]},{"id":"2-62","set":2,"n":62,"q":"“다케시마를 시마네현 소속 오끼도사의 소관으로 한다”는 어디에 규정되어 있나?","o":["대일평화조약","시마네현 고시 제40호","태정관지령","한일합방조약"],"a":1,"e":["‘시마네현 고시 제40호’에 “다케시마는 시마네현 소속 오끼도사의 소관으로 한다”라고 규정되어 있다."]},{"id":"2-63","set":2,"n":63,"q":"다음 중 독도를 울릉도의 동쪽에 표기한 지도가 아닌 것은?","o":["동국지도","여지도","조선전도","천하대총일람도"],"a":3,"e":["‘천하대총일람도’와 ‘팔도총도’는 독도를 울릉도의 서쪽에 표기한 지도이다. 동국지도, 여지도, 조선전도, 청구도 등은 독도를 울릉도의 동쪽에 표기한 지도이다."]},{"id":"2-64","set":2,"n":64,"q":"다음 ( )를 완성하시오.\n대한제국칙령 제41호 제2조는 “군청의 위치를 대하동으로 정하고 구역을 ( A ) 전도와 ( B ), ( C )를 관할할 것”이라고 규정하고 있다.","o":["A: 울릉  ·  B: 우도  ·  C: 석도","A: 석도  ·  B: 죽도  ·  C: 울릉도","A: 울릉  ·  B: 죽도  ·  C: 석도","A: 독도  ·  B: 석도  ·  C: 죽도"],"a":2,"e":["제2조는 “구역을 울릉전도와 죽도, 석도를 관할할 것”이라고 규정하고 있다."]},{"id":"2-65","set":2,"n":65,"q":"러시아 해군이 조선 동해안 일대를 탐사한 후 1857년에 발간한 지도를 일본해군성이 1976년에 재발간한 지도는?","o":["삼국접양도","조선동해안도","한국전도","팔도총도"],"a":1,"e":["러시아 해군이 조선 동해안 일대를 탐사하고 1857년에 제작한 지도를 일본해군성이 1876년에 재발행한 지도가 ‘조선동해안도’이다.","그림 4 . 조선동해안도"]},{"id":"2-66","set":2,"n":66,"q":"울릉도와 독도 사이에 있는 해산의 이름은?","o":["이사부","안용복","심흥택","이규원"],"a":1,"e":["울릉도와 독도 사이에는 안용복 해산, 독도에서 동남쪽 15km 떨어진 곳에 심흥택 해산, 55km 떨어진 곳에 이사부 해산이 각각 있다."]},{"id":"2-67","set":2,"n":67,"q":"Donghaeana Dokdonensis는 무엇을 말하는가?","o":["독도문제가 국제재판소에 제소될 것에 대비하여 준비된 답변서의 명칭","독도 주변해역의 심층수","독도 주변 배타적 경제수역에 매장된 천연가스","독도에만 있는 미생물"],"a":3,"e":["2005년 발견한 독도에만 있는 미생물의 이름이다."]},{"id":"2-68","set":2,"n":68,"q":"역사적 권원에 관한 설명으로 틀린 것은?","o":["역사적 권원(historic title)은 현대국제법 성립 이전의 권원이다.","봉건적 권원(feudal title)은 역사적 권원이다.","본원적 권원(original title)은 역사적 권원이 아니다.","역사적 권원은 현대국제법상 권원으로 대체되지 아니하면 현대국제법상 효력이 없다. 대체된 후 역사적 권원은 효력을 상실한다."],"a":2,"e":["본원적 권원은 역사적 권원이다."]},{"id":"2-69","set":2,"n":69,"q":"다음 설명 중 틀린 것은?","o":["‘대한제국칙령 제41호’에 의해 한국의 독도에 대한 역사적 권원은 현대국제법상 권원으로 대체되었다.","따라서 오늘 독도의 역사적 권원을 주장하는 것은 국제법상으로 거의 의미가 없다.","신라 이사부 장군이 우산국을 정복하여 독도의 역사적 권원을 취득했다는 주장은 ‘대한제국칙령 제41호’ 이후 무의미한 것이다.","따라서 대한제국칙령 제 41호 이전에 독도에 대한 실효적 지배의 주장은 중요한 의미를 갖는다."],"a":3,"e":["대체 이전의 실효적 지배의 주장은 거의 의미가 없게 된다."]},{"id":"2-70","set":2,"n":70,"q":"한국은 1992년 유엔지명표준화회의에서 동해를 어떻게 표기할 것을 제의했나?","o":["East Sea","Korea Sea","East Sea/Sea of japan","Japan Sea/East Sea"],"a":2,"e":["한국은 유엔지명표준화회의에서 동해를 ‘East Sea/Sea of Japan’으로 표기할 것을 제의했다."]},{"id":"2-71","set":2,"n":71,"q":"평화조약과 관계있는 것은?","o":["compromis","critical date","dominium","uti possidetis의 원칙"],"a":3,"e":["① compromis는 분쟁당사자 간의 제소합의를 말한다.","② critical date는 재판의 기준이 되는 일자를 말한다.","③ dominium은 “영유권”을 뜻하는 것으로 “영역권”일 imperium과 구별된다. 점령권사령관은 점령영토에 대해 imperium을 가지나 dominium을 가지지 아니한다. dominium의 귀속은 평화조약으로 정해진다.","④ 평화조약에 규정이 없는 것은 평화조약이 체결될 당시의 현상대로 효력이 인정된다는 원칙을 utipossidetis의 원칙이라 한다. “대일평화조약”에 규정이 없는 독도의 영유권은 동원칙에 따라 “SCAPIN 제 677호”에 의해 분리된 현상대로 한국에 있다."]},{"id":"2-72","set":2,"n":72,"q":"다음 ( )를 완성하시오.\nSCAPIN 제 677호 제3항은 독도를 ( A )로 표기하고 동 지령에 첨부된 지도에는 독도를 ( B )로 표기하고 있다.","o":["A: Dokdo  ·  B: Dokdo","A: Liancourt RK(TAKE)  ·  B: TAKE","A: Takesima  ·  B: Takesima","A: Dokdo  ·  B: Ulung"],"a":1,"e":["‘SCAPIN 제677호’ 제3항에 일본으로부터 제외되는 지역으로 독도가 Liancourt RK(TAKE)으로 표기되어 있고 동 지령에 첨부된 지도에는 독도가 TAKE로 표기되어 있다."]},{"id":"2-73","set":2,"n":73,"q":"시찰관 우용정의 보고와 관계있는 것은?","o":["시마네현 고시 제40호의 통보","안용복의 제2차 도일","대한제국칙령 제41호","동국여지승람"],"a":2,"e":["시찰관 우용정의 울릉도 시찰보고서에 의거, 고종은 ‘대한제국칙령 제41호’를 제정•공표하게 된다."]},{"id":"2-74","set":2,"n":74,"q":"‘아국총도(我國總圖)는 어디에 수록된 지도인가?","o":["『여지도』","『신증동국여지승람』","『동국문헌비고』","『증보문헌비고』"],"a":0,"e":["‘아국총도’는 『여지도』에 수록되어 있는 지도이다. 이 지도에는 울릉도와 우산도(독도)가 그려져 있으며 독도가 울릉도보다 작게 울릉도의 동쪽에 그려져 있다."]},{"id":"2-75","set":2,"n":75,"q":"다음 ( )를 완성하시오.\n( A )에는 “울릉도와 우산은 모두 ( B ) 땅인데 우산은 바로 왜인들이 말하는 ( C )이다.”라고 기록되어 있다.","o":["A: 증보문헌비고  ·  B: 우산국  ·  C: 송도","A: 증보문헌비고  ·  B: 조선  ·  C: 송도","A: 동국문헌비고  ·  B: 조선  ·  C: 죽도","A: 동국문헌비고  ·  B: 조선  ·  C: 송도"],"a":0,"e":["『중보문헌비도』에는 “울릉도와 우산은 모두 조선의 땅인데 우산은 바로 왜인들이 말하는 송도이다”라고 기록되어 있다."]},{"id":"2-76","set":2,"n":76,"q":"중간수역에 관한 다음 기술 중 틀린 것은?","o":["“한일어업협정”에 의해 설치되었다.","독도의 영해 접속수역, 배타적 경제수역을 포함하고 있다.","울릉도와 오끼섬의 중간에 위치하고 있다.","한일 배타적 경제수역의 경계획정 협정이 체결되기까지 잠정적으로 존재한다."],"a":1,"e":["중간수역은 “한일어업협정”에 의해 설치된 것으로 동 협정은 한일 양국의 배타적 경제수역에 적용되므로 독도의 ‘영해 접속수역’에 적용되지 아니한다. 그러므로 중간수역은 독도의 영해와 배타적 경제수역을 포함하지 아니한다."]},{"id":"2-77","set":2,"n":77,"q":"동해 중간수역에 관한 다음 기술 중 틀린 것은?","o":["독도 주위에 설치되어 있다.","중간수역 내에서 기국주의가 적용된다.","잠정수역이다.","한국이 일방적으로 폐기할 수 없다."],"a":3,"e":["중간수역은 “한일어업협정”에 의해 설치된 것으로 동 협정은 발효 이후 3년 이후에 어느 일방도 상대방에게 폐기통보할 수 있으므로(제16조 제2항) 중간수역을 한국이 일방적으로 폐기할 수 있다."]},{"id":"2-78","set":2,"n":78,"q":"“우산, 울릉 두 섬은 모두 우산국이다”라고 기록되어 있는 것은?","o":["『강계고』","『삼국사기』","『고려사』","『신증동국여지승람』"],"a":0,"e":["신경준이 지은 『강계고』에 “우산, 울릉 두 섬은 모두 우산국이다”라고 기록되어 있다."]},{"id":"2-79","set":2,"n":79,"q":"다음 설명 중 틀린 것은?","o":["국제법상 독도는 섬으로서 영해, 접속수역, 배타적 경제수역 그리고 대륙붕을 가질 수 있다.","독도를 인간이 거주할 수 없거나 독자적인 경제활동을 할 수 없는 암석으로 보면 독도는 배타적 경제수역과 대륙붕을 가지지 아니한다.","독도는 인간이 거주할 수 있고 독자적인 경제활동을 할 수 있는 섬이므로 배타적 경제수역과 대륙붕을 갖는다.","독도는 인간이 거주할 수 없거나 독자적인 경제활동을 할 수 없는 암석으로 보는 입장은 없다."],"a":3,"e":["독도를 “유엔해양법협약” 제121조 제3항의 암석으로 보는 주장(정부)이 없지 않다."]},{"id":"2-80","set":2,"n":80,"q":"다음 (    )를 완성하시오.\n‘대한제국칙령 제41호’의 명칭은 울릉도를 ( A )로 개칭하고 도감을 ( B )로 개칭하는 건이다.","o":["A: 무릉도  ·  B: 울릉 검찰사","A: 석도  ·  B: 도감사","A: 울도  ·  B: 군수","A: 무릉도  ·  B: 군수"],"a":2,"e":["대한제국칙령 제41호는 “울릉도를 울도로 개칭하고 도감을 군수로 개칭하는 건”이다."]},{"id":"2-81","set":2,"n":81,"q":"우용정의 울릉도 조사보고서의 명칭은?","o":["울릉•자산 순심","울릉도 순심","울도 보고서","울릉도 사핵"],"a":3,"e":["우용정이 내부대신에게 제출한 울릉도 조사보고서를 울릉도 사핵(鬱陵島 査覈)이라고 한다."]},{"id":"2-82","set":2,"n":82,"q":"다음 연결 중 틀린 것은?","o":["국제수로기구 – 해양과 바다의 경계","독도와 울릉도 간의 해산 – 이사부 해산","울릉전도와 죽도, 석도 – 대한제국칙령 제41호","독도의 해저지형 – 수면 아래에 높이 약 2,000m, 하부지름 20~25km인 봉우리 형태"],"a":1,"e":["독도와 울릉도 사이에 있는 해산은 안용복 해산이다."]},{"id":"2-83","set":2,"n":83,"q":"다음 인물의 활약을 연대순으로 나열한 것은?","o":["이사부, 우용정, 안용복, 심흥택, 홍순칠","이사부, 심흥택, 안용복, 우용정, 홍순칠","이사부, 심흥택, 우용정, 안용복, 홍순칠","이사부, 안용복, 우용정, 심흥택, 홍순칠"],"a":3,"e":["이사부 : 512, 안용복 : 1693, 1696, 우용정 : 1900, 심흥택 : 1906, 홍순칠 : 1953"]},{"id":"2-84","set":2,"n":84,"q":"다음 기술 중 틀린 것은?","o":["자산도는 조선 숙종 때 독도의 명칭이다.","은주시청합기에 독도를 죽도(竹島)로 표기하고 있다.","1953년 전 『바다와 해양의 경계』에는 동해를 Japan Sea로 표기하고 있다.","독도등대는 동도에 있고, 어민숙소는 서도에 있다."],"a":1,"e":["『은주시청합기』에는 독도를 ‘송도’로 표기하고 있다."]},{"id":"2-85","set":2,"n":85,"q":"우리 「헌법」 상 모든 국민은 독도에 대해 어떠한 의무를 지나?","o":["수호","방어","보전","방위"],"a":3,"e":["모든 국민은 국토방위의 의무를 진다(제39조 제1항)"]},{"id":"2-86","set":2,"n":86,"q":"다음 설명 중 틀린 것은?","o":["「문화재보호법」은 독도를 실효적으로 지배하는 근거의 하나이다.","SCAPIN 제677호는 대일평화조약에 의해 그 효력이 무효화되었다.","대일평화조약 제2조 (a)항에 독도가 일본이 포기하는 한국의 도서로 열거되어 있지 않다.","울릉도와 독도 사이에 안용복 해산이 있다."],"a":1,"e":["SCAPIN 제677호는 “대일평화조약” 제19조 (d)항에 의거, 그 효력이 승인되었다."]},{"id":"2-87","set":2,"n":87,"q":"독도는 천연기념물 몇 호로 지정되어 있나?","o":["제333호","제336호","제366호","제633호"],"a":1,"e":["독도는 천연기념물 제366호로 지정되어 있다."]},{"id":"2-88","set":2,"n":88,"q":"다음 설명 중 틀린 것은?","o":["평화선은 독도의 외측에 설정되었다.","한일어업협정은 독도의 배타적 경제수역을 훼손했다.","독도는 1905년 당시 한국의 영토였으므로 시마네현 고시 제 40호로 독도를 선점할 수 없다.","『삼국사기』에는 울릉도와 독도가 우산국의 영토라고 기록되어 있다."],"a":3,"e":["『삼국사기』에는 독도가 우산국의 영토라는 기록이 없다. 그러한 기록은 『만기요람』에 있다."]},{"id":"2-89","set":2,"n":89,"q":"다음 중 연대순으로 나열된 것은?","o":["SCAPIN 제1033호, SCAPIN 제677호, 대일평화조약,평화선 선언","SCAPIN 제677호, SCAPIN 제1033호, 평화선 선언,대일평화조약","SCAPIN 제677호, SCAPIN 제1033호, 대일평화조약,평화선 선언","SCAPIN 제1033호, SCAPIN 제677호, 평화선 선언,대일평화조약"],"a":2,"e":["SCAPIN 제677호 : 1946.1.29. / SCAPIN 제1033호 : 1946.6.22. / 대일평화조약 : 1951.9.8. / 평화선 선언 : 1952.1.18."]},{"id":"2-90","set":2,"n":90,"q":"다음 중 연대순으로 나열된 것은?A : 태정관 지령문 B : 은주시청합기 C : 조선국교제시말내탐서","o":["A, B, C","B, C, A","C, B, A","B, A, C"],"a":1,"e":["은주시청합기 : 1667년, 조선국교제시말내탐서 : 1876년, 태정관 지령문 : 1877년"]},{"id":"2-91","set":2,"n":91,"q":"동해 중간수역을 설정하는 근거는?","o":["유엔 조약법 협약","한일 대륙붕 공동개발 협정","한일어업협정","한일 배타적 경제수역 경계확정 협정"],"a":2,"e":["한일어업협정에 의해 동해 중간수역이 설정되었다."]},{"id":"2-92","set":2,"n":92,"q":"일본 육군참모국이 제작한 대일본전도(1877년)에 대한 설명으로 옳은 것은?","o":["독도는 청색으로 착색되어 있다.","독도는 적색으로 착색되어 있다.","독도는 황색으로 착색되어 있다.","독도는 그려져 있지 않다."],"a":3,"e":["일본 육군참모국이 1877년에 제작한 ‘대일본전도’에는 일본영토로 표시했으나 독도는 표시되어 있지 않다."]},{"id":"2-93","set":2,"n":93,"q":"SCAPIN 제677호에 관한 다음 기술 중 틀린 것은?","o":["연합국최고사령관이 1946년 1월 29일 일본 정부에 하달한 지령이다.","동 지령은 8개 항으로 구성되어 있다.","동 지령 제3항은 울릉도, 독도, 제주도를 일본의 통치로부터 제외된다고 규정하고 있다.","동 지령은 “대일평화조약”에 의해 무효화되었다."],"a":3,"e":["“대일평화조약” 제19조 (d)항에 의해 그 효력이 그대로 인정되었다."]},{"id":"2-94","set":2,"n":94,"q":"1898년 프랑스 군지제작소가 제작한 강릉(Kang Neung)이라는 지도에 표시된 독도의 명칭은?\nA: Scala Oliontsa   B: Scala Marel\nC: Rocks Liancourt   D: Lle Hornet","o":["A","A, B","A, B, C","A, B, C, D"],"a":3,"e":["이상 4개의 명칭을 모두 기록하고 있다."]},{"id":"2-95","set":2,"n":95,"q":"안용복이 도일할 때 갖고 간 지도는?","o":["삼국접양도","조선팔도지도","일본국전도","조선동해안도"],"a":1,"e":["안용복은 도일 시 ‘조선팔도지도’를 지참했다. 이를 보고 일본 관리가 ‘조선지판도’를 옮겨 썼다."]},{"id":"2-96","set":2,"n":96,"q":"“한일어업협정”이 적용되는 해역은?","o":["오끼섬의 영해","울릉도의 영해","독도의 배타적 경제수역","오끼도의 내수"],"a":2,"e":["“한일어업협정”은 한일 양국의 배타적 경제수역에 적용된다."]},{"id":"2-97","set":2,"n":97,"q":"“한일어업협정‘이 적용되지 않는 해역은?","o":["오끼섬의 배타적 경제수역","독도의 배타적 경제수역","울릉도의 배타적 경제수역","독도의 영해"],"a":3,"e":["“한일어업협정”은 한일 양국의 배타적 경제수역에 적용된다."]},{"id":"2-98","set":2,"n":98,"q":"다음 ( )를 완성하시오.\n한일어업협정은 발효 후 ( A )이 지난 후 어느 일방체약국도 협정의 ( B )를 상대방에게 통고할 수 있다.","o":["A: 2년  ·  B: 폐기","A: 3년  ·  B: 종료","A: 4년  ·  B: 포기","A: 5년  ·  B: 소멸"],"a":1,"e":["“한일어업협정”은 “협정이 발효 후 3년이 지난 후 어느 일방체약국도 협정의 종료를 상대방에게 통고할 수 있다”고 규정하고 있다."]},{"id":"2-99","set":2,"n":99,"q":"시마네현 고시 제40호가 국제법상 무효인 첫째의 이유는?","o":["당시 독도가 무인도였다.","당시 독도자 무주지였다.","당시 독도가 유인도였다.","당시 독도가 무주지가 아니었다."],"a":3,"e":["선점의 첫째 요건은 선점의 대상인 영토가 무주지임을 요한다. ‘시마네현 고시 제40호’가 제정될 당시 독도는 무주지가 아니라 한국의 영토였다."]},{"id":"2-100","set":2,"n":100,"q":"동해 중간수역은 울릉도에서 몇 해리 밖에, 그리고 오끼도에서 몇 해리 밖에 설정되었나?","o":["각각 9해리","각각 12해리","각각 24해리","각각 35해리"],"a":3,"e":["동해 중간수역은 울릉도에서 35해리 이원(以遠)에, 오끼도에서 35해리 이원에 설정되었다."]}];

const KEY='dokdo-goldenbell-v1';

/* ---------- helpers ---------- */
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function mascotHTML(){ return MASCOT_SRC ? `<img src="${MASCOT_SRC}" alt="독도 골든벨 캐릭터">` : bellSVG(); }
function bellSVG(){return `<svg viewBox="0 0 48 48" width="70%" height="70%" aria-hidden="true">
  <path d="M24 6c-7 0-12 5.5-12 13v8l-4 6h32l-4-6v-8c0-7.5-5-13-12-13z" fill="var(--gold)" stroke="var(--brown)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M15 33l5-8 4 4 5-7 5 11z" fill="var(--island)"/>
  <circle cx="24" cy="38" r="3.5" fill="var(--brown)"/></svg>`}
function stats(set){
  const ids=Q.filter(q=>!set||q.set===set).map(q=>q.id);
  let c=0,w=0; ids.forEach(id=>{const a=S.ans[id]; if(a){a.c?c++:w++}});
  return {total:ids.length,c,w,done:c+w};
}
function wrongAdd(id){ if(!S.wrong.includes(id)) S.wrong.push(id) }
function wrongDel(id){ S.wrong=S.wrong.filter(x=>x!==id) }
function updBadge(){ $('#wrongBadge').textContent = S.wrong.length?`(${S.wrong.length})`:'' }
function splitExpl(e){
  const lead=[],notes=[]; let inNotes=false;
  e.forEach(p=>{ if(/^-/.test(p)) inNotes=true; (inNotes?notes:lead).push(p) });
  return {lead,notes};
}

function go(tab){
  stopTimer(); run=null; TAB=tab;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===tab));
  ({practice:viewPractice,bell:viewBell,wrong:viewWrong,record:viewRecord})[tab]();
  window.scrollTo(0,0);
}

const PV={}, PV_SCORE=[20,18,15,10,5];
async function previews(pre){
  for(let i=0;i<TIERS.length;i++){
    if(!PV[i]){ const cv=document.createElement('canvas'); cv.width=1080; cv.height=1350;
      PV[i]=await drawCard(PV_SCORE[i],TIERS[i],today(),'예시 · 2학년 3반 김독도',cv); }
    const el=$('#'+pre+i); if(el) el.src=PV[i];
  }
}
