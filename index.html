/* ---------- runs ---------- */
function startPractice(set,resume,startN){
  const ids=Q.filter(q=>q.set===set).map(q=>q.id);
  const list= order[set]==='rnd' && !startN ? shuffle(ids) : ids;
  const i = startN? startN-1 : (resume? (S.last[set]||1)-1 : 0);
  run={kind:'practice',set,title:`세트 ${set}${order[set]==='rnd'&&!startN?' · 무작위':''}`,list,i,picked:{},seq:order[set]!=='rnd'||!!startN};
  renderQ();
}
function startList(list,title){ run={kind:'review',title,list,i:0,picked:{}}; renderQ(); }
function startChallenge(){
  run={kind:'bell',title:'골든벨 도전',list:shuffle(Q.map(q=>q.id)).slice(0,CH_N),i:0,picked:{},score:0};
  renderQ();
}
function stopTimer(){ if(timerId){clearInterval(timerId);timerId=null} }

function renderQ(){
  stopTimer();
  const id=run.list[run.i], q=BYID[id], picked=run.picked[id];
  const answered = picked!==undefined;
  const isBell=run.kind==='bell';
  const pct=((run.i+(answered?1:0))/run.list.length*100);
  $('#app').innerHTML=`<section class="view">
    <div class="qbar">
      <button class="btn ghost" id="quit">${isBell?'그만하기':'목록으로'}</button>
      <span class="count">${run.i+1} / ${run.list.length}</span>
      <div class="prog"><i style="width:${pct}%"></i></div>
      ${isBell?`<span class="count" title="맞힌 개수">맞힘 ${run.score}</span><span class="timer" id="timer" aria-live="off">${CH_SEC}</span>`:''}
    </div>
    <article class="qcard">
      <div><span class="chip">세트 ${q.set} · ${q.n}번</span></div>
      <div class="qtext">${esc(q.q)}</div>
      <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}" id="opt${k}"><span class="no">${CIR[k]}</span><span>${esc(o)}</span><span class="mark"></span></button>`).join('')}</div>
      <div id="fb"></div>
    </article>
    <div class="qnav" id="qnav"></div>
  </section>`;
  $('#quit').onclick=()=>{ if(isBell){stopTimer();go('bell')} else go(run.kind==='review'?'wrong':'practice') };
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(answered) showAnswer(false); else { navButtons(); if(isBell) startTimer(); }
}
function startTimer(){
  let left=CH_SEC; const el=$('#timer');
  timerId=setInterval(()=>{ left--; if(!el.isConnected){stopTimer();return}
    el.textContent=left; el.classList.toggle('low',left<=5);
    if(left<=0){stopTimer(); answer(-1)} },1000);
}
function answer(k){
  const id=run.list[run.i]; if(run.picked[id]!==undefined) return;
  stopTimer();
  const q=BYID[id], ok=k===q.a;
  run.picked[id]=k;
  S.ans[id]={c:ok,t:Date.now()};
  if(ok){ if(run.kind==='review') wrongDel(id) } else wrongAdd(id);
  if(run.kind==='bell' && ok) run.score++;
  if(run.kind==='practice' && run.seq) S.last[run.set]=Math.min(100,q.n+1);
  save(); updBadge();
  showAnswer(true);
}
function showAnswer(fresh){
  const id=run.list[run.i], q=BYID[id], k=run.picked[id], ok=k===q.a;
  document.querySelectorAll('.opt').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a){b.classList.add('correct');b.querySelector('.mark').textContent='정답'}
    else if(i===k){b.classList.add('wrong');b.querySelector('.mark').textContent='내 선택'}
  });
  const {lead,notes}=splitExpl(q.e);
  const verdict= ok?'정답이에요!': (k===-1?`시간 초과! 정답은 ${CIR[q.a]}`:`아쉬워요. 정답은 ${CIR[q.a]}`);
  let html=`<div class="feedback ${ok?'ok':'no'}" role="status"><div class="verdict">${verdict}</div>`;
  if(run.kind!=='bell' || true){
    if(lead.length) html+=`<div class="expl">${lead.map(p=>`<p>${esc(p)}</p>`).join('')}</div>`;
    else if(!notes.length) html+=`<p class="expl muted">이 문항은 원본 자료에 해설이 없어요.</p>`;
    else html+=`<p class="expl muted">이 문항과 관련된 내용 정리가 있어요. 아래를 펼쳐 보세요.</p>`;
    if(notes.length) html+=`<details class="notes"><summary>관련 내용 정리 보기</summary><div class="body">${notes.map(p=>`<p>${esc(p.replace(/^-\s*/,'· '))}</p>`).join('')}</div></details>`;
  }
  html+='</div>';
  $('#fb').innerHTML=html;
  const p=document.querySelector('.qbar .prog i'); if(p) p.style.width=((run.i+1)/run.list.length*100)+'%';
  const sc=document.querySelector('.qbar .count[title]'); if(sc) sc.textContent='맞힘 '+run.score;
  navButtons();
  if(fresh) $('#fb').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
}
function navButtons(){
  const id=run.list[run.i], answered=run.picked[id]!==undefined, last=run.i===run.list.length-1;
  const isBell=run.kind==='bell';
  let left = !isBell && run.i>0 ? `<button class="btn" id="prev">이전 문제</button>` : '<span></span>';
  let right;
  if(isBell) right = answered ? `<button class="btn ${last?'gold':'primary'}" id="next">${last?'결과 보기':'다음 문제'}</button>` : '';
  else right = last ? (answered?`<button class="btn primary" id="done">다 풀었어요</button>`:'') : `<button class="btn ${answered?'primary':''}" id="next">${answered?'다음 문제':'건너뛰기'}</button>`;
  $('#qnav').innerHTML=left+right;
  const pv=$('#prev'); if(pv) pv.onclick=()=>{run.i--;renderQ()};
  const nx=$('#next'); if(nx) nx.onclick=()=>{ if(isBell&&last) return finishBell(); run.i++; renderQ(); window.scrollTo(0,0)};
  const dn=$('#done'); if(dn) dn.onclick=()=>finishPractice();
}
function finishPractice(){
  const ids=run.list, c=ids.filter(id=>run.picked[id]===BYID[id].a).length, n=Object.keys(run.picked).length;
  $('#app').innerHTML=`<section class="view"><div class="panel result">
    <span class="eyebrow">${esc(run.title)} 완료</span>
    <div class="score">${c}<span class="muted" style="font-size:1.4rem"> / ${n}</span></div>
    <p class="muted">이번에 푼 ${n}문제 중 ${c}문제를 맞혔어요.</p>
    <div class="btns" style="justify-content:center"><button class="btn primary" id="toWrong">오답노트 보기</button><button class="btn" id="toHome">처음으로</button></div>
  </div></section>`;
  $('#toWrong').onclick=()=>go('wrong'); $('#toHome').onclick=()=>go('practice');
}

/* ---------- golden bell result + card ---------- */
function today(){const d=new Date();return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`}
function finishBell(){
  const s=run.score, t=tierOf(s), d=today();
  S.hist.push({s,d}); if(S.best==null||s>S.best) S.best=s; save();
  const missed=run.list.filter(id=>run.picked[id]!==BYID[id].a).length;
  $('#app').innerHTML=`<section class="view"><div class="panel result">
    <span class="eyebrow">골든벨 도전 결과</span>
    <div class="score">${s}<span class="muted" style="font-size:1.4rem"> / ${CH_N}</span></div>
    <h2>${t.name}</h2><p class="muted">${t.sub}</p>
    <div class="field"><label for="nick"><b>인증카드에 넣을 이름</b></label><input id="nick" maxlength="12" placeholder="예: 2학년 3반 김독도" value="${esc(S.nick)}"></div>
    <img class="cardimg" id="cardimg" alt="${t.name} 인증카드: ${s}/${CH_N}">
    <div class="btns" style="justify-content:center">
      <button class="btn gold" id="saveCard">인증카드 저장</button>
      <button class="btn primary" id="again">다시 도전</button>
      ${missed?`<button class="btn" id="toWrong">틀린 ${missed}문제 복습</button>`:''}
    </div>
    <p class="hint" id="saveHint">저장이 안 되면 카드 이미지를 길게 누르거나 화면을 캡처해 주세요.</p>
  </div></section>`;
  const draw=async()=>{const u=await drawCard(s,t,d,$('#nick').value.trim()); const im=$('#cardimg'); if(im) im.src=u;};
  draw();
  $('#nick').oninput=()=>{S.nick=$('#nick').value.trim();save();draw()};
  $('#again').onclick=startChallenge;
  const tw=$('#toWrong'); if(tw) tw.onclick=()=>go('wrong');
  $('#saveCard').onclick=async()=>{
    try{
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      const blob = await new Promise(r=>CARD.toBlob(r,'image/png'));
      if(!blob){ toast('카드를 만들지 못했어요. 카드를 길게 눌러 저장해 주세요.'); return }
      if(!dl){
        const u=URL.createObjectURL(blob), a=document.createElement('a');
        a.href=u; a.download=`독도골든벨_${t.name}_${s}점.png`; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(u),4000);
        toast('인증카드를 내려받았어요. 안 받아졌다면 카드를 길게 눌러 저장해 주세요.'); return;
      }
      await dl.save({filename:`독도골든벨_${t.name}_${s}점.png`, data:blob});
      toast('인증카드를 저장했어요');
    }catch(e){
      if(e&&e.code==='declined') return;
      toast('저장하지 못했어요. 카드를 길게 눌러 저장해 주세요.');
    }
  };
}
let CARD=document.createElement('canvas'); CARD.width=1080; CARD.height=1350;
let mascotImg=null;
if(MASCOT_SRC){ mascotImg=new Image(); mascotImg.src=MASCOT_SRC; }
async function drawCard(s,t,d,nick,cv=CARD){
  try{ await Promise.all([document.fonts.load('80px "Paperlogy Black"'),document.fonts.load('700 40px "Paperlogy"'),document.fonts.load('400 30px "Paperlogy"')]) }catch(e){}
  const c=cv.getContext('2d'), W=1080, H=1350;
  const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,t.c1); g.addColorStop(1,t.c2);
  c.fillStyle=g; c.fillRect(0,0,W,H);
  // sea waves
  c.globalAlpha=.12; c.fillStyle='#fff';
  for(let k=0;k<4;k++){ c.beginPath(); const y=H-120-k*46; c.moveTo(0,y);
    for(let x=0;x<=W;x+=60) c.quadraticCurveTo(x+30,y+(k%2?18:-18),x+60,y); c.lineTo(W,H); c.lineTo(0,H); c.fill(); }
  c.globalAlpha=1;
  // inner frame
  c.strokeStyle='rgba(255,255,255,.55)'; c.lineWidth=6; roundRect(c,48,48,W-96,H-96,40); c.stroke();
  // emblem
  const cx=W/2, cy=345;
  if(mascotImg && !mascotImg.complete){ await new Promise(r=>{mascotImg.onload=r;mascotImg.onerror=r}) }
  if(mascotImg && mascotImg.naturalWidth){
    if(s===20){ c.save(); c.translate(cx,cy); c.strokeStyle='rgba(255,255,255,.75)'; c.lineWidth=10; c.lineCap='round';
      for(let a=0;a<16;a++){const r=a*Math.PI/8; c.beginPath(); c.moveTo(Math.cos(r)*215,Math.sin(r)*215); c.lineTo(Math.cos(r)*250,Math.sin(r)*250); c.stroke()} c.restore(); }
    c.fillStyle='rgba(255,255,255,.22)'; c.beginPath(); c.arc(cx,cy,200,0,Math.PI*2); c.fill();
    const h=400, w=mascotImg.naturalWidth*h/mascotImg.naturalHeight;
    c.drawImage(mascotImg,cx-w/2,cy-h/2+10,w,h);
    c.save(); c.translate(cx+190,cy-150); c.scale(.55,.55); c.rotate(.25); drawBell(c,0,0,false); c.restore();
  } else { c.fillStyle='rgba(255,255,255,.18)'; c.beginPath(); c.arc(cx,cy,170,0,Math.PI*2); c.fill(); drawBell(c,cx,cy,s===20); }
  c.textAlign='center'; c.fillStyle=t.ink;
  c.font='700 36px "Paperlogy", sans-serif'; c.globalAlpha=.85;
  c.fillText('도전! 독도골든벨 연습 인증', cx, 620); c.globalAlpha=1;
  c.font='120px "Paperlogy Black", sans-serif'; c.fillText(t.name, cx, 760);
  c.font='700 34px "Paperlogy", sans-serif'; c.globalAlpha=.9; c.fillText(t.sub, cx, 830); c.globalAlpha=1;
  c.font='150px "Paperlogy Black", sans-serif'; c.fillText(`${s} / ${CH_N}`, cx, 1010);
  c.font='700 46px "Paperlogy", sans-serif'; c.fillText(nick||'이름을 입력하세요', cx, 1110);
  c.font='400 30px "Paperlogy", sans-serif'; c.globalAlpha=.85;
  c.fillText(`${d}  ·  10월 25일 독도의 날`, cx, 1190); c.globalAlpha=1;
  return cv.toDataURL('image/png');
}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawBell(c,cx,cy,shine){
  c.save(); c.translate(cx,cy);
  if(shine){ c.strokeStyle='rgba(255,255,255,.8)'; c.lineWidth=8; for(let a=0;a<12;a++){const r=a*Math.PI/6; c.beginPath(); c.moveTo(Math.cos(r)*150,Math.sin(r)*150); c.lineTo(Math.cos(r)*175,Math.sin(r)*175); c.stroke()} }
  c.fillStyle='#F5C93A'; c.strokeStyle='#5A3A14'; c.lineWidth=8; c.lineJoin='round';
  c.beginPath(); c.moveTo(0,-120); c.bezierCurveTo(-80,-120,-90,-40,-90,10); c.lineTo(-90,50); c.lineTo(-120,90); c.lineTo(120,90); c.lineTo(90,50); c.lineTo(90,10); c.bezierCurveTo(90,-40,80,-120,0,-120); c.closePath(); c.fill(); c.stroke();
  // Dokdo two islets
  c.fillStyle='#2E6A3E'; c.beginPath(); c.moveTo(-70,70); c.lineTo(-30,-5); c.lineTo(-5,30); c.lineTo(10,70); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(5,70); c.lineTo(35,15); c.lineTo(70,70); c.closePath(); c.fill();
  c.fillStyle='#5A3A14'; c.beginPath(); c.arc(0,108,18,0,Math.PI*2); c.fill();
  c.beginPath(); c.arc(0,-130,14,0,Math.PI*2); c.fill();
  c.restore();
}
