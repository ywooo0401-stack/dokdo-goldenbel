/* Layout: 노란 상단 바 + 탭, 가운데 단일 칼럼(최대 720px) 카드형 문제지. 종(노랑)·바위(갈색)·섬(초록은 정답 표시에만) */
:root{
  --bg:#FFF6D9; --surface:#FFFDF5; --sunk:#FCEDBF; --ink:#3B2A12; --muted:#7D6845; --line:#F0DDA2;
  --head:#FFC83D; --on-head:#3B2A12; --island:#3E8A4F;
  --pri:#7A4A1C; --pri-soft:#FFE7A0; --on-pri:#FFF8E6;
  --brown:#8A5523; --brown-soft:#F7E0BC;
  --gold:#F5B41E; --gold-soft:#FFEDB5; --gold-ink:#7A5300;
  --ok:#2F8049; --ok-soft:#E1F1DD; --bad:#C0472F; --bad-soft:#FBE1D8;
  --f-display:"Paperlogy Black","Paperlogy",system-ui,sans-serif;
  --f-body:"Paperlogy",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1810; --surface:#272016; --sunk:#31291B; --ink:#F6ECD4; --muted:#BEAB88; --line:#45391F;
  --head:#E2AC2A; --on-head:#231907; --island:#7CC08A;
  --pri:#F5C64A; --pri-soft:#3B3016; --on-pri:#231907;
  --brown:#D9A677; --brown-soft:#3D2D1C;
  --gold:#F5C64A; --gold-soft:#3B3016; --gold-ink:#F5C64A;
  --ok:#73C68F; --ok-soft:#1F3826; --bad:#EC8169; --bad-soft:#43231B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1810; --surface:#272016; --sunk:#31291B; --ink:#F6ECD4; --muted:#BEAB88; --line:#45391F;
  --head:#E2AC2A; --on-head:#231907; --island:#7CC08A;
  --pri:#F5C64A; --pri-soft:#3B3016; --on-pri:#231907;
  --brown:#D9A677; --brown-soft:#3D2D1C;
  --gold:#F5C64A; --gold-soft:#3B3016; --gold-ink:#F5C64A;
  --ok:#73C68F; --ok-soft:#1F3826; --bad:#EC8169; --bad-soft:#43231B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}

/* header */
header.top{background:var(--head);color:var(--on-head);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:400;font-size:1.3rem;letter-spacing:.02em;white-space:nowrap}
.brand small{display:block;font-size:.72rem;opacity:.85;letter-spacing:.06em}
.mascot{width:44px;height:44px;border-radius:50%;background:var(--surface);border:2px solid var(--brown);display:grid;place-items:center;flex:none;overflow:hidden}
.mascot img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;transform:scale(1.35);transform-origin:50% 20%}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:12px 9px 10px;font-size:.95rem;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:#FF8A1F}
main{padding-block:20px 48px}
section.view{display:grid;gap:16px}

h1,h2{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(1.6rem,5vw,2.1rem)}
h2{font-size:1.25rem}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;color:var(--brown)}
.muted{color:var(--muted)}
p{margin:0}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.hero .lead{display:grid;gap:6px;min-width:0}
.hero{background:linear-gradient(180deg,var(--surface) 55%,var(--pri-soft));position:relative;overflow:hidden}
.hero .big-mascot{width:150px;max-width:100%;align-self:end}
.hero .big-mascot img{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 10px rgb(0 0 0 / .15))}
.poster{display:grid;line-height:1.05;font-size:clamp(2.2rem,8vw,3.1rem);letter-spacing:-.01em}
.poster .l1{color:var(--ink);font-size:.62em}
.poster .l2{background:linear-gradient(180deg,#FFD84A 20%,#FF8A1F 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(2px 3px 0 var(--brown));padding-bottom:4px}
.titlerow{display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.m-only{display:none;width:96px;flex:none}
.m-only img{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 8px rgb(0 0 0 / .15))}
.notice{background:var(--surface);border:2px solid var(--head);border-radius:var(--r);padding:16px 18px;display:grid;gap:10px}
.nhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nhead b{font-size:1.05rem}
.ntag{background:#FF8A1F;color:#fff;font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:99px;letter-spacing:.04em}
.ninfo{margin:0;display:grid;gap:6px}
.ninfo div{display:grid;grid-template-columns:3.2em 1fr;gap:8px;align-items:baseline}
.ninfo dt{font-weight:700;color:var(--brown)}
.ninfo dd{margin:0;font-weight:700;min-width:0}
.nfoot{font-size:.9rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(104px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.strip figure{margin:0;display:grid;gap:4px;scroll-snap-align:start}
.strip img{width:100%;aspect-ratio:4/5;border-radius:10px;background:var(--sunk);box-shadow:0 2px 8px rgb(0 0 0 / .14)}
.strip figcaption{display:grid;font-size:.78rem;line-height:1.35}
.strip figcaption span{color:var(--muted);font-variant-numeric:tabular-nums}
.event{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;margin-top:4px}
.event span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.event b{color:var(--brown);margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--f-display);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:.75rem;color:var(--muted)}

/* set chooser */
.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.setcard{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left}
.setcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.setcard h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.meter{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .c{background:var(--ok)} .meter .w{background:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:10px 18px;font-weight:700}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3A2A00}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:700;color:var(--muted);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* challenge banner */
.bell-banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:20px;display:grid;gap:12px}
.bell-banner h2{color:var(--gold-ink)}
.tiers{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.cardgrid figure{margin:0;display:grid;gap:6px}
.cardgrid img{width:100%;aspect-ratio:4/5;border-radius:12px;background:var(--sunk);box-shadow:0 3px 10px rgb(0 0 0 / .14)}
.cardgrid figcaption{display:flex;justify-content:space-between;gap:6px;font-size:.85rem}
.cardgrid figcaption span{color:var(--muted);font-variant-numeric:tabular-nums}
.tiers li{display:flex;align-items:center;gap:10px;font-size:.92rem}
.tiers .sw{width:14px;height:14px;border-radius:4px;flex:none}
.tiers .rng{font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px}

/* quiz */
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qbar .prog{flex:1;min-width:140px;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.qbar .prog i{display:block;height:100%;background:var(--pri);transition:width .25s}
.qbar .count{font-variant-numeric:tabular-nums;font-weight:700}
.timer{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums;min-width:3ch;text-align:right;color:var(--pri)}
.timer.low{color:var(--bad)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:16px}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--brown-soft);color:var(--brown)}
.qtext{font-size:1.12rem;font-weight:700;white-space:pre-line;line-height:1.55}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;line-height:1.5}
.opt .no{font-weight:700;color:var(--brown)}
.opt .mark{font-weight:700;font-size:.85rem}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .mark{color:var(--bad)}
.feedback{border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.feedback.ok{background:var(--ok-soft)} .feedback.no{background:var(--bad-soft)}
.feedback .verdict{font-weight:700}
.feedback.ok .verdict{color:var(--ok)} .feedback.no .verdict{color:var(--bad)}
.expl{font-size:.95rem;display:grid;gap:8px}
details.notes{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 12px}
details.notes summary{cursor:pointer;font-weight:700;padding:8px 0;color:var(--pri)}
details.notes .body{display:grid;gap:8px;padding-bottom:12px;font-size:.92rem;max-width:65ch}
.qnav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* grid map */
.qmap{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.qmap button{aspect-ratio:1;max-width:100%;border:0;border-radius:6px;background:var(--sunk);font-size:.72rem;font-variant-numeric:tabular-nums;color:var(--muted);padding:0}
.qmap button.c{background:var(--ok);color:#fff}
.qmap button.w{background:var(--bad);color:#fff}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--sunk)}
.legend .lc::before{background:var(--ok)} .legend .lw::before{background:var(--bad)}

/* wrong list */
.wlist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.wlist li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.wlist .t{min-width:0;font-size:.93rem}
.wlist .t b{color:var(--brown);margin-right:6px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:8px;justify-items:center}

/* result */
.result{display:grid;gap:16px;justify-items:center;text-align:center}
.result .score{font-family:var(--f-display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.cardimg{width:100%;max-width:420px;border-radius:16px;box-shadow:0 6px 24px rgb(0 0 0 / .18);background:var(--sunk);aspect-ratio:4/5}
.field{display:grid;gap:6px;text-align:left;width:100%;max-width:420px}
.field input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.hint{font-size:.85rem;color:var(--muted)}
.history{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.92rem}
.history td,.history th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.confirm{background:var(--bad-soft);border-radius:10px;padding:12px;display:grid;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:20}
@media (max-width:480px){
  .hero{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .hero .big-mascot{display:none}
  .m-only{display:block!important}
  .qcard{padding:16px}
  .qtext{font-size:1.05rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
